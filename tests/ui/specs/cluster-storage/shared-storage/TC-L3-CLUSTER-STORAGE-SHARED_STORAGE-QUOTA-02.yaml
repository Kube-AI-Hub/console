id: TC-L3-CLUSTER-STORAGE-SHARED_STORAGE-QUOTA-02
level: 3
suite: point
module: cluster-storage
submodule: shared-storage
feature: quota
title: 卷与配额 · 调整配额弹窗
entry_url: "{BASE_URL}/clusters/default/juicefs-storage/volumes"
prd: prd/cluster-storage/shared-storage/quota.md
design: design/cluster-storage/shared-storage/quota.md

covers:
- AC-L3-CLUSTER-STORAGE-SHARED_STORAGE-QUOTA-02

story:
- US2

product: 配额弹窗的初始值、下限校验与提交结果。
preconditions:
- 已登录，且在 default 集群
- 集群至少有一个共享卷
steps:
- 打开 /clusters/default/juicefs-storage/volumes
- 点第一行的「调整配额」，读取目录、已用与当前配额，读取输入框初始值
- 把输入改成 1（GiB）并确定，核对提示与确定按钮状态
- 点取消，核对表格配额未变
- 再次打开，改成当前值 +1（TiB）并确定，核对表格配额更新
expected:
- 弹窗初始值等于当前配额（按单位换算）
- 输入低于已用时确定按钮不可用，并出现下限提示
- 取消后表格配额不变
- 提交成功后表格配额变为新值
troubleshoot:
- 输入框为空说明 Form.Item 覆盖了受控 Input
- 提交无反应时看 Input 的 onChange 是否按 (event, value) 取第二个参数
update_automation:
- 单位下拉变化时改 QuotaModal 的定位
