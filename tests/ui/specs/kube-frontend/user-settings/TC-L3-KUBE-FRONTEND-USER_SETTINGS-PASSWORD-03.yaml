id: TC-L3-KUBE-FRONTEND-USER_SETTINGS-PASSWORD-03
level: 3
suite: point
module: kube-frontend
submodule: user-settings
feature: password
title: 密码设置 · 强度面板：四条 checklist、三档强度与进度条
entry_url: '{BASE_URL}/kube-frontend'
prd: prd/kube-frontend/user-settings/password.md
design: design/kube-frontend/user-settings/password.md

covers:
- AC-L3-KUBE-FRONTEND-USER_SETTINGS-PASSWORD-04

story:
- US1

edge_cases:
- 新密码为空时强度面板不渲染
- 新密码 abc：长度、大小写、数字、特殊字符四条都不满足
- 规则全满足但不足 12 位：中
- 规则全满足且 12 位以上：强
- 合规长密码去掉特殊字符后只剩 special 一条翻回未满足

product:
- 新密码框下方常驻一块强度面板：四条 checklist 随输入打勾，强度分弱/中/强三档，除颜色外还有文字标签与进度条（33% / 66% / 100%）。

preconditions:
- 已登录（共享登录态即可：本用例只输入不提交，不写账号）

steps:
- 打开 {BASE_URL}/kube-frontend，从账号菜单打开「用户设置」，切到「密码设置」
- 先看新密码框上方的常驻规则说明
- 先不输入新密码，看强度面板是否存在
- 新密码输入 abc
- 换成 Abcdefg1!（四条规则全满足、9 位）
- 换成 Abcdefgh123!（四条规则全满足、12 位）
- 换成 Abcdefgh1234（去掉特殊字符）
- 清空新密码
- 每一步读取 data-strength、四条 checklist 的 data-met 与进度条宽度

expected:
- 新密码框上方常驻 user-settings:password-rule 规则说明，且文案里写明「特殊字符」
- 新密码为空时页面没有 user-settings:password-strength 节点
- abc 时 data-strength=weak，四条 checklist 的 data-met 全为 false，进度条 33%
- Abcdefg1! 时四条 checklist 的 data-met 全为 true，data-strength=medium，进度条 66%
- Abcdefgh123! 时 data-strength=strong，进度条 100%
- Abcdefgh1234 时 special 的 data-met 翻回 false、length 仍为 true，强度回到 weak
- 三档各有对应文字标签（弱 / 中 / 强），不是只靠颜色
- 清空后强度面板消失

troubleshoot:
- 强度只有颜色变化：data-strength 有值但面板里找不到「弱/中/强」文字
- 进度条宽度对不上：实现可能把宽度写在类名里，页面对象先读内联 style，没有就按像素量占轨道的比例
- 面板不出现：检查是不是仍按老 console 的浮层实现，只在 focus 时弹出

update_automation:
- 句柄或三档判定变化时改 pages/user_settings.py
