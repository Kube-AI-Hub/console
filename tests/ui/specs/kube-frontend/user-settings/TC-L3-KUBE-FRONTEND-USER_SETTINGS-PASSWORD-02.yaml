id: TC-L3-KUBE-FRONTEND-USER_SETTINGS-PASSWORD-02
level: 3
suite: point
module: kube-frontend
submodule: user-settings
feature: password
title: 密码设置 · 当前密码错误留在弹窗，改成功后自动退出且旧密码失效
entry_url: '{BASE_URL}/kube-frontend'
prd: prd/kube-frontend/user-settings/password.md
design: design/kube-frontend/user-settings/password.md

covers:
- AC-L3-KUBE-FRONTEND-USER_SETTINGS-PASSWORD-02

story:
- US1

edge_cases:
- 当前密码错误时弹窗不关、不签出
- 改密成功后平台不作废旧 token，退出登录由前端完成

product:
- 密码设置页签：当前密码错误时弹窗留在原地并说明原因；当前密码正确时修改成功，自动退出登录回到登录页，旧密码登录失败、新密码登录成功。

preconditions:
- 用管理员令牌通过 kapis 新建临时账号 tc-e2e-uset-<uuid>（platform-regular），用例结束在 finally 里删除
- 在独立 browser context 里用登录页真登录该临时账号（改密会结束会话，不能借用共享登录态）

steps:
- 以临时账号登录，从账号菜单打开「用户设置」，切到「密码设置」
- 当前密码填错、新密码合规，点「修改密码」
- 当前密码改对，点「修改密码」
- 等弹窗自动退出并跳到登录页
- 用旧密码登录
- 用新密码登录

expected:
- 第一次显示 user-settings:password-error「当前密码不正确。」，弹窗仍在、没有成功提示
- 第二次显示 user-settings:password-saved「密码已修改，请用新密码重新登录。」
- 随后自动签出，地址变成 /login 并出现登录页
- 旧密码登录显示登录失败（login:error，data-ai-state 为 error）
- 新密码登录成功，离开登录页回到控制台

troubleshoot:
- 改密成功却仍停在控制台：说明只跳了页面没清会话，旧 token 仍然可用（实测平台不主动作废）
- 旧密码还能登进去：改密请求可能打到了错误端点

update_automation:
- 文案或退出登录时序变化时改 pages/user_settings.py 与 pages/login.py
