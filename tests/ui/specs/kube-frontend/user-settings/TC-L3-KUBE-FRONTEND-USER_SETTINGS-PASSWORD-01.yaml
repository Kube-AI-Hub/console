id: TC-L3-KUBE-FRONTEND-USER_SETTINGS-PASSWORD-01
level: 3
suite: point
module: kube-frontend
submodule: user-settings
feature: password
title: 密码设置 · 必填、规则与一致性在本地拦下且不发请求
entry_url: '{BASE_URL}/kube-frontend'
prd: prd/kube-frontend/user-settings/password.md
design: design/kube-frontend/user-settings/password.md

covers:
- AC-L3-KUBE-FRONTEND-USER_SETTINGS-PASSWORD-01

story:
- US1

edge_cases:
- 三项全空
- 新密码 'abcdefgh1'：8 位以上且有小写字母与数字，缺大写字母
- 新密码 'Abc1'：字符类别齐全但只有 4 位
- 新密码 30 个汉字：字符数只有 30，但 UTF-8 下是 90 字节，超过 64 字节上限
- 两次输入不一致

product:
- 密码设置页签在提交前就挡住三类问题：三项必填、新密码不满足平台规则（8–64 位且同时含小写字母、大写字母、数字）、两次输入不一致；被挡下时不发写请求。

preconditions:
- 用管理员令牌通过 kapis 新建临时账号 tc-e2e-uset-<uuid>（platform-regular），用例结束在 finally 里删除
- 在独立 browser context 里用登录页真登录该临时账号

steps:
- 以临时账号登录，从账号菜单打开「用户设置」，切到「密码设置」
- 不填任何字段直接点「修改密码」
- 三项都填，新密码用 abcdefgh1（缺大写）再点一次
- 新密码改成 Abc1（太短）再点一次
- 新密码换成 30 个汉字（字符数没超、字节数 90 超限）再点一次
- 新密码与确认密码填成两个不同的合规值再点一次
- 统计整个过程的写请求

expected:
- 第一次显示「请填写当前密码、新密码与确认密码。」
- 缺大写时显示「密码需包含大写字母。」
- 太短时显示「密码至少 8 位。」
- 30 个汉字时显示「密码不能超过 64 字节。」（上限按 UTF-8 字节计，不按字符数）
- 不一致时显示「两次输入的密码必须一致。」
- 五次都没有发往 users/<name> 或 /password 的写请求
- 弹窗始终留在原地（没有签出、没有跳转）

troubleshoot:
- 出现 422 说明前端没挡住，服务端拒绝的正文是整条准入正则，不适合直接展示
- 提示文案对不上：密码规则与措辞的唯一来源是 api-client 的 passwordProblem 与 locales

update_automation:
- 规则或文案变化时改用例里的常量与 pages/user_settings.py
