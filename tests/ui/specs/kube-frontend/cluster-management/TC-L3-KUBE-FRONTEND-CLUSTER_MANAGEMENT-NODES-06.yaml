product: 查看节点资源并以局部写入维护节点元数据。
preconditions:
- 当前账号有节点读写权限，节点有监控采样
steps:
- 添加唯一临时标签并提交，以 API 回读核对保存结果
- 输入无效污点，验证错误后取消，核对原污点不变
- 切换容器组与事件页签，确认独立数据视图可达
- 打开监控页签，核对 CPU 趋势具有多个采样
- finally 仅清除本用例添加的标签
expected:
- 标签保存后页面与 API 一致，不覆盖其他元数据
- 无效污点不写入，取消保持原对象
- 节点关联资源与监控可读，测试不驱逐工作负载
