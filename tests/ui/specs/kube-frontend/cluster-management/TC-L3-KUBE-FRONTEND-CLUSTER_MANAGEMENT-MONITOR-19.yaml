title: 集群监控 · 图表面板首屏骨架与就绪态同高
entry_url: "{BASE_URL}/kube-frontend/clusters/host/monitor?tab=resource"
prd: prd/kube-frontend/cluster-management/monitor.md
design: design/kube-frontend/cluster-management/monitor.md

covers:
- AC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-MONITOR-19

story:
- US1

product: 物理资源监控页首次加载时，每张图表卡片以骨架占位（标题条 + 轴刻度 + 脉冲带 + 图例行），骨架卡片与数据到达后的卡片高度相同；数据到达时页面不跳动，且骨架期间不出现「无数据」说明。
preconditions:
- 已登录，host 集群
- 监控接口的响应被暂时挂起，以便观察首屏状态
steps:
- 拦截 monitoring.kubesphere.io 的 range 读，先不放行
- 打开 /kube-frontend/clusters/host/monitor?tab=resource
- 读取某张图表卡片的 data-ai-state、骨架句柄与卡片高度，以及卡片三个子块的高度
- 放行请求并等待数据到达
- 再读同一卡片的高度与三个子块高度
expected:
- 首屏卡片的 data-ai-state 为 loading，存在 <aiId>:loading 骨架，且不存在 <aiId>:empty
- 骨架卡片的标题条、图表区、图例行三段高度与就绪态分别相等（差值 ≤ 1px）
- 数据到达后骨架消失，卡片总高度与首屏相同（差值 ≤ 1px）
- 骨架期间不出现「无数据」段落
troubleshoot:
- 首屏空白：加载态用了由响应构建的 charts 列表，首屏它为空，改用静态 spec 清单
- 数据到达时卡片变矮：骨架多渲染了 empty 段落，或标题/图例占位高度与真实行不一致
- 骨架比卡片矮：ChartSkeleton 没有带 legend，漏掉了图例占位
update_automation:
- 卡片句柄：data-ai-id="cluster-monitor:resource:chart:<group>:<key>"；骨架是其子元素 <aiId>:loading
- 子块高度用 section > div 的顺序读取（标题 / 图表 / 图例）
