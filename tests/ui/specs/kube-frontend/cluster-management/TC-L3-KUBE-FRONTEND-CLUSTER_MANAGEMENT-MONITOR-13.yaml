title: 集群监控 · 物理资源页签：5 组 18 张多序列图（坐标轴/图例/空态）
entry_url: '{{BASE_URL}}/kube-frontend/clusters/host/monitor'
prd: prd/kube-frontend/cluster-management/monitor.md
design: design/kube-frontend/cluster-management/monitor.md

covers:
- AC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-MONITOR-13

story:
- US8

product: 物理资源监控页签按 GPU / 主机资源 / 磁盘 I/O / 网络 / RDMA 五组渲染 18 张趋势图，单张图承载同一指标的多个身份（负载 1/5/15、磁盘读/写吞吐与 IOPS、网络收发、Pod 三态、RDMA 端口/吞吐/错误）；每张图有坐标轴、网格、图例与交互读数；某指标无数据时该图给说明（<chart id>:empty）而不是零线；本页签一次 range 查询取全部指标。
preconditions:
- 已登录 admin，集群 host 已就绪，监控后端可用
- 本页签所需 cluster_* 指标在 range query 中可用（缺失的指标按空态断言并登记）
steps:
- 打开 /kube-frontend/clusters/host/monitor?tab=resource，等待 surface 与页签面板就绪
- 核对分组顺序与标题：gpu → host → disk → network → rdma，对应 cluster-monitor:resource:group:<g>
- 核对每组图数量：gpu 3（gpuMemory/gpuUtilization/gpuAllocated）、host 6（cpu/memory/load/diskUsage/inode/pods）、disk 2（throughput/iops）、network 1（traffic）、rdma 6（health/ports/throughput/linkSpeed/errors/linkDowned），合计 18
- 逐图核对 cluster-monitor:resource:chart:<group>:<key> 可见；有数据时至少画出一条曲线并有图例 :chart:<group>:<key>:legend；无数据时渲染 :chart:<group>:<key>:empty 说明且不画零线
- 核对多序列身份：load 图三条（load1/load5/load15 或 cluster_load1/5/15 合并后）；磁盘吞吐/IOPS 各两条（读/写）；网络流量两条（发送/接收）；Pod 图三条（运行中/已完成/异常）；RDMA 端口两条（已启用/总端口）、RDMA 吞吐两条（发送/接收）、RDMA 错误三条（接收错误/重传/丢弃）；线与图例一一对应
- 核对单位：利用率类图为百分比（含 %）；吞吐/流量为 B/s 系单位；IOPS 两位小数；链路速率为 Gb/s（API 的 bit/s ÷1e9，一位小数）
- 核对本页签只有一次集群 range 查询：清空请求记录后打开 resource 页签，等待就绪，统计 /monitoring.kubesphere.io/v1alpha3/cluster 请求数为 1
- 用 page.route 让 range query 返回只含部分指标（例如仅 cpu）：核对对应图仍画线，其余指标图显示 :empty 说明、不出现零线
expected:
- 五个分组按 gpu/host/disk/network/rdma 顺序渲染，18 张图齐全（3/6/2/1/6）
- 每张图有标题、曲线、坐标轴与图例（单序列图图例可仅一项）；空数据图为 <chart id>:empty 说明
- 多序列身份按契约 §5 合并，图例项与线的身份一致，不同身份不混成一条
- 单位正确：利用率百分比、吞吐 B/s 系、IOPS 两位小数、链路速率 Gb/s 一位小数
- 本页签一次 range 查询完成全部指标；部分指标缺失时只影响对应图
troubleshoot:
- 18 张图少了：分组配置缺项，或某指标无数据时整图被隐藏（应保留图并显示 :empty）
- 多序列图只有一条线：身份没有按 label 合并，而是每条 series 覆盖前一条
- 链路速率差 8 倍：把 bit/s 当字节/s 格式化
- 切换页签后出现两次 range 查询：页签重复挂载或查询 key 不稳定
update_automation:
- 句柄：cluster-monitor:resource:group:<gpu|host|disk|network|rdma> / cluster-monitor:resource:chart:<group>:<key>[:legend|:empty]