id: TC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-CLUSTER_PVC-01
level: 3
suite: point
module: kube-frontend
submodule: cluster-management
feature: cluster-pvc
title: 集群级存储卷声明 · 跨项目列表
entry_url: '{BASE_URL}/kube-frontend/clusters/host/persistentvolumeclaims'
prd: prd/kube-frontend/cluster-management/cluster-pvc.md
design: design/kube-frontend/cluster-management/cluster-pvc.md

covers:
- AC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-CLUSTER_PVC-01

story:
- US1

product: 集群级存储卷声明的跨项目只读列表：名称（链接）、项目、状态、容量、访问模式、存储类型、创建时间；服务端关键字搜索与每页 20 条分页。
preconditions:
- 已登录，且对 host 集群有读取权限
- 集群里至少有一个存储卷声明
steps:
- 用 API 读跨项目存储卷声明首页（page=1, limit=20）
- 打开集群级存储卷页
- 核对表头与行数
- 逐行核对项目列与名称链接
- 输入一个唯一名称，核对搜索发往服务端且收敛到该行
expected:
- 行数等于 min(20,total)
- 表头包含 名称/项目/状态/容量/访问模式/存储类型/创建时间
- 项目列等于对象命名空间
- 名称链接含 /projects/<namespace>/persistentvolumeclaims/<name>，且带 workspace 段
- 搜索请求带 name= 参数，结果包含该对象
troubleshoot:
- 行数为 0：请求带了 namespace 段
- 表头缺列：页面把项目级 schema 直接复用而未替换列
- 搜索不收敛：关键词没有传给服务端（前端过滤当前页）
- 名称链接 404：链接里漏了 workspace 段
update_automation:
- 选择器见 pages/cluster_management.py 与 @/pages/cluster/ClusterPersistentVolumeClaimsPage.tsx；行句柄是 namespace/name
