id: TC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-DEVOPS_PROJECTS-01
level: 3
suite: point
module: kube-frontend
submodule: cluster-management
feature: devops-projects
title: DevOps 工程 · 列表空态与详情页签骨架
entry_url: '{BASE_URL}/kube-frontend/clusters/host/devops'
prd: prd/kube-frontend/cluster-management/devops-projects.md
design: design/kube-frontend/cluster-management/devops-projects.md

covers:
- AC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-DEVOPS_PROJECTS-01

story:
- US1

product: 集群作用域的 DevOps 区域：列表（devopsprojects CRD，名称/描述/企业空间/创建时间，空态明确）与详情骨架（基本信息 + 成员/角色/凭证页签，各集合独立显示表格/空态/失败原因+重试；工程不存在时 not-found）。只读。
preconditions:
- 已登录，且 devopsprojects CRD 与相关 kapis 集合可读（当前集群 0 个工程，空态为主路径）
- 只读用例，不依赖 webhook
steps:
- 用 API 读 /apis/devops.kubesphere.io/v1alpha3/devopsprojects 得到工程数 N
- 打开集群 DevOps 列表，等待 devops:surface 离开 loading
- N 为 0 时核对空态文案与 0 行；N>0 时核对行数与 N、并确认名称链接存在
- 打开详情：有工程用第一个工程名，否则用 tc-e2e-missing-devops
- 等待 devops-detail:surface；不存在时核对 :not-found
- 依次点击 成员 / 角色 / 凭证 页签，核对 aria-selected 与面板可见，且面板内出现表格/空态/失败原因之一
expected:
- 列表 surface 可见且 data-ai-state 为 empty（N=0）或 ready
- 空态显示「暂无 DevOps 工程」；有数据时行数为 N
- 详情页签可切换：每次点击后对应页签 aria-selected=true，面板 devops-detail:<tab> 可见
- 每个面板恰好显示 devops-detail:<tab>-table / :<tab>-empty / :<tab>-error 之一，不出现空表冒充空态
- 工程不存在时 devops-detail:not-found 可见（页签仍可切换）
troubleshoot:
- 列表整页错误：误用了 /kapis/devops.kubesphere.io/v1alpha3/devopsprojects（该路径 404），应读 /apis/... CRD
- 页签面板空白：只渲染了表格，未处理 pending/empty/error 三态
- 详情 404 处理错：CRD 404 的 Status 应映射为 ApiError.isNotFound（客户端已处理），不要把 404 当普通错误重试
- 写类操作：本轮不应出现任何写请求
update_automation:
- 选择器：devops:surface/devops:link:<name>/devops:retry；devops-detail:surface/title/basic/not-found/tab:members|roles|credentials 与各面板 -table/-empty/-error/-retry
