module: kube-frontend
submodule: cluster-management
feature: devops-projects
title: DevOps 工程 · 列表与详情三态骨架
entry_url: '{BASE_URL}/kube-frontend/clusters/host/devops'
prd: prd/kube-frontend/cluster-management/devops-projects.md
design: design/kube-frontend/cluster-management/devops-projects.md

covers:
- AC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-DEVOPS_PROJECTS-01

story:
- US1

product: 集群作用域的 DevOps 区域：列表（devopsprojects CRD，名称/描述/企业空间/创建时间，空态明确，右上提供创建入口）与详情（默认基本信息；成员/角色/凭证页签各集合独立显示表格/空态/失败原因+重试；工程不存在时 not-found，页签仍可切换）。
preconditions:
- 已登录，且 devopsprojects CRD 与 iam/devops kapis 集合可读（B200 有 1 个迁移探针工程，0 工程时空态分支保留）
- 只读用例，不创建对象
steps:
- 用 API 读 /apis/devops.kubesphere.io/v1alpha3/devopsprojects 得到工程数 N
- 打开集群 DevOps 列表，等待 devops:surface 离开 loading
- N 为 0 时核对空态文案与 0 行；N>0 时核对行数与 N、并确认名称链接存在
- 打开详情：有工程用第一个工程名，否则用 tc-e2e-missing-devops
- 等待 devops-detail:surface；不存在时核对 :not-found，存在时核对默认页签 base-info aria-selected=true 与基本信息可见
- 依次点击 成员 / 角色 / 凭证 页签，核对 aria-selected 与面板可见，且面板内出现表格/空态/失败原因之一
expected:
- 列表 surface 可见且 data-ai-state 为 empty（N=0）或 ready；列表存在 devops:create 创建入口
- 空态显示「暂无 DevOps 工程」；有数据时行数为 N，每行 data-ai-row 与接口对象名一致
- 详情默认 tab:base-info aria-selected=true；存在工程时基本信息卡可见
- 每个属性页签点击后 aria-selected=true，面板 devops-detail:<tab>-panel 可见
- 每个面板恰好显示 devops-detail:<tab>-table / :<tab>-empty / :<tab>-error 之一，不出现空表冒充空态
- 工程不存在时 devops-detail:not-found 可见，且页签仍可点击切换
troubleshoot:
- 列表整页错误：误用了 /kapis/devops.kubesphere.io/v1alpha3/devopsprojects（该路径 404），应读 /apis/... CRD
- 页签面板空白：只渲染了表格，未处理 pending/empty/error 三态
- 详情 404 处理错：CRD 404 的 Status 应映射为 ApiError.isNotFound，不要把 404 当普通错误重试
- 整页 Something went wrong：先看浏览器 pageerror（历史上是 Select 空字符串 value）
update_automation:
- 选择器：devops:surface/devops:create/devops:link:<name>/devops:retry；devops-detail:surface/title/basic/not-found/tab:base-info|members|roles|credentials 与各面板 -panel/-table/-empty/-error/-retry
