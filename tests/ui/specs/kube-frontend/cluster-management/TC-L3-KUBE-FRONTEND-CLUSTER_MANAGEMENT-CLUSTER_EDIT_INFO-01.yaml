title: 编辑集群信息 · 四个字段写回与清空
entry_url: '{BASE_URL}/kube-frontend/clusters'
prd: prd/kube-frontend/cluster-management/cluster-edit-info.md
design: design/kube-frontend/cluster-management/cluster-edit-info.md

covers:
- AC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-CLUSTER_EDIT_INFO-01
- AC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-CLUSTER_EDIT_INFO-02

story:
- US1

product: 集群列表的行操作「编辑信息」修改别名、标签、供应商与描述；四个字段复用「添加集群」的同一套控件；清空即删除对应键。
preconditions:
- 已登录，且有平台管理权限
- 集群对象可写
steps:
- 打开集群列表，对目标集群点「编辑信息」
- 核对四个字段的控件形态（别名与描述为输入框、标签与供应商为下拉）
- 展开标签下拉，记录全部选项
- 展开供应商下拉，记录全部选项
- 填入别名/标签/供应商/描述并确认
- 读回集群对象逐项核对，并检查列表名称列显示别名
- 再次打开清空别名/标签/描述并确认
- 读回确认对应键已删除
- 清理：把集群的注解/标签/供应商恢复原值
expected:
- 名称字段禁用且带说明「集群名称是对象标识，接入后不可修改」
- 标签下拉为 5 项：无/生产/开发/测试/演示（与添加集群一致）
- 供应商下拉为 8 项，且为可搜索下拉而非自由文本输入（与添加集群一致）
- 四个字段写入对象
- 列表主行显示别名、副行显示对象名
- 清空后注解与标签键被删除
- 保存成功后弹出「已保存」通知
performance:
- 无特殊要求；保存为单次 PATCH
troubleshoot:
- 显示已保存但值没变：清空必须发 null（merge patch 缺失键=不修改）
- 名称列读到别的列：用 data-ai-id 定位而不是 td 序号
- select_option 报「不是 select 元素」：标签已改为 Radix 下拉，需点击后选 role=option
update_automation:
- 字段变化时改 pages/cluster_fleet.py 的 open_edit 与字段选择器
