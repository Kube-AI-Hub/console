id: TC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-CUSTOM_MONITORING-01
level: 3
suite: point
module: kube-frontend
submodule: cluster-management
feature: custom-monitoring
title: 自定义监控 · 仪表板列表、YAML 与删除
entry_url: '{BASE_URL}/kube-frontend/clusters/{cluster}/custom-monitoring'
prd: prd/kube-frontend/cluster-management/custom-monitoring.md
design: design/kube-frontend/cluster-management/custom-monitoring.md

covers:
- AC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-CUSTOM_MONITORING-01
- AC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-CUSTOM_MONITORING-02
