id: TC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-MONITOR-06
level: 3
suite: point
module: kube-frontend
submodule: cluster-management
feature: monitor
title: 集群监控 · 系统组件 APIServer/Scheduler 多序列、身份与单位
entry_url: '{BASE_URL}/kube-frontend/clusters/host/monitor'
prd: prd/kube-frontend/cluster-management/monitor.md
design: design/kube-frontend/cluster-management/monitor.md

covers:
- AC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-MONITOR-06

story:
- US4

product: 集群监控页在物理资源分组之后显示「系统组件」分区；APIServer 请求速率/延迟与 Scheduler 调度尝试/速率按 verb、result 身份分成多条线，延迟以 ms、速率为次/秒，全 NaN 的序列不画成 0 线。
preconditions:
- 监控后端可用，且 /kapis/monitoring.kubesphere.io/v1alpha3/components/apiserver 与 .../scheduler 返回 200
- 页面默认时间窗为最近 1 小时
steps:
- 打开集群监控，等 cluster-monitor:surface 离开 loading，再等 cluster-monitor:group:apiserver / scheduler 进入 ready
- 核对系统组件分区存在，三个子组顺序为 API Server → Scheduler → etcd
- 读取 APIServer 请求延迟卡片的图例身份，与同一窗口接口返回的 apiserver_request_by_verb_latencies 的 verb 集合比对
- 读取 Scheduler 调度尝试与尝试速率卡片的图例身份，与 scheduler_schedule_attempts 的 result 集合比对
- 读取调度延迟卡片的空态，并确认接口的 scheduler_e2e_scheduling_latency_quantile 没有序列
expected:
- 分区在物理资源五组之后；三个子组顺序固定，etcd 子组显示未上报（其断言在 TC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-MONITOR-07）
- APIServer 请求延迟图例按 verb 一条线，整条为 NaN 的 APPLY 不出现、不画 0 线；总平均单独一条
- 延迟显示为 ms（接口秒值 ×1000），请求速率与按 verb 速率为次/秒；按 verb 速率之和与总速率相近
- Scheduler 调度尝试为 scheduled/error/unschedulable 三条整数线，尝试速率为三条次/秒线；有序列且值为 0 时显示 0
- 调度延迟（平均与分位）在本部署无序列时卡片显示空态说明，不显示 0
troubleshoot:
- 只看到一条延迟线：多序列被按位置合并或按指标名合并，检查 componentMonitorQueries.ts 的身份标签
- 延迟显示成 0.00x：秒没有 ×1000，检查 formatComponentValue 的 milliseconds 分支
- APPLY 出现一条贴底直线：NaN 没有过滤，检查 api-client component 方法的 Number.isFinite
