preconditions:
- 已登录，且有集群权限
- 集群内至少有一个节点

steps:
- 打开节点页
- 核对表头
- 读取第一行的状态徽章
- 用 API 核对节点数

expected:
- 表头依次为 名称、状态、角色、CPU、内存
- 状态为 Ready 或 NotReady 或 Unknown
- 行数与 API 返回的节点数一致

troubleshoot:
- 状态与 kubectl 不一致时看 nodeStatus 的 Ready 条件判断
- 角色为空时看 nodeRole 的缺省值

update_automation:
- 节点列变化时改 pages/cluster_management.py
