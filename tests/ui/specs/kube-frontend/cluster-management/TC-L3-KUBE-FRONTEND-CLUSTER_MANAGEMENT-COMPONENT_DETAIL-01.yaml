id: TC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-COMPONENT_DETAIL-01
level: 3
suite: point
module: kube-frontend
submodule: cluster-management
feature: component-detail
title: 系统组件详情与后端容器组
entry_url: '{BASE_URL}/kube-frontend/clusters/host/components'
prd: prd/kube-frontend/cluster-management/component-detail.md
design: design/kube-frontend/cluster-management/component-detail.md

covers:
- AC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-COMPONENT_DETAIL-01

story:
- US1

product: 从系统组件列表点击组件名进入详情，展示健康/后端数量/启动时间与该组件的后端容器组。
preconditions:
- 已登录且可读取集群组件与容器组
steps:
- 打开系统组件列表
- 点击第一个组件名称
- 观察详情字段与后端容器组表
steps_expected:
- 详情显示健康徽标、后端数量、命名空间、启动时间
- 后端容器组表显示名称/状态/节点，或显示明确空态
expected:
- 上述两段都可见（不需要写操作）
troubleshoot:
- 详情 404：路由未注册（components/$name）
- 后端容器组一直为空：该组件无后端或命名空间不可读
update_automation:
- 选择器：component-detail / component-detail:pods / component-detail:no-pods
