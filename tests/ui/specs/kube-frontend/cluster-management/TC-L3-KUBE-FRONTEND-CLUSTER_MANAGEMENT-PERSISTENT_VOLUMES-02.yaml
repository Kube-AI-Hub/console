id: TC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-PERSISTENT_VOLUMES-02
level: 3
suite: point
module: kube-frontend
submodule: cluster-management
feature: persistent-volumes
title: 持久卷列表 · 持久卷详情
entry_url: '{BASE_URL}/kube-frontend/clusters/host/persistentvolumes'
prd: prd/kube-frontend/cluster-management/persistent-volumes.md
design: design/kube-frontend/cluster-management/persistent-volumes.md

covers:
- AC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-PERSISTENT_VOLUMES-02

story:
- US2

product: 从持久卷列表点名称进入详情：状态、容量、访问模式、回收策略、存储类型、卷模式、挂载选项、创建时间与绑定声明；数据来自该卷对象。
preconditions:
- 已登录，且对 host 集群有读取权限
- 集群至少有一个持久卷
steps:
- 用 API 读取持久卷列表，取第一个卷的名称、回收策略、容量与绑定声明
- 打开持久卷页，点击该卷名称
- 核对详情页 URL 与各区块
- 核对回收策略、容量、访问模式与对象一致
- 核对绑定声明显示为 <namespace>/<name>
expected:
- 详情页可达且状态 ready
- 回收策略、容量、访问模式、存储类型与对象一致
- 绑定的声明显示 namespace/name；未绑定时明确说明
troubleshoot:
- 详情打不开：确认 $name 路由与列表链接参数一致
- 容量显示原始值：应经 quantity 格式化
- 绑定声明显示空：读取的是 spec.claimRef 而不是 status
update_automation:
- 选择器见 pages/cluster_management.py 与 PersistentVolumeDetailPage.tsx
