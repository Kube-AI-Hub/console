id: TC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-LOG_SEARCH-01
level: 3
suite: point
module: kube-frontend
submodule: cluster-management
feature: log-search
title: 容器日志查询 · 检索与分页
entry_url: '{BASE_URL}/kube-frontend/clusters/host/logs'
prd: prd/kube-frontend/cluster-management/log-search.md
design: design/kube-frontend/cluster-management/log-search.md

covers:
- AC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-LOG_SEARCH-01

story:
- US1

product: 集群日志检索：时间窗口 + 项目/容器组/容器/关键字过滤 + 服务端分页。
preconditions:
- 已登录，且对 host 集群有读取权限
- 集群日志组件在采集（ES 索引有数据）
steps:
- 用 API 读最近 1 小时日志的 total 与首页条数
- 打开容器日志查询页
- 核对首页行数、总数显示
- 按项目过滤后核对只剩该项目的日志
expected:
- 首页行数等于 min(50, total)
- 底部显示总数与页码
- 项目过滤后行内只出现该项目的命名空间
troubleshoot:
- 行数为 0：时间参数传了毫秒（接口要秒）
- 过滤无效：用了单数键（namespace/pod），应使用 namespaces/pods
- 总数不符：断言了会随时间增长的总数（应只比首页条数）
update_automation:
- 选择器见 pages/cluster_management.py 与 ClusterLogsPage.tsx
