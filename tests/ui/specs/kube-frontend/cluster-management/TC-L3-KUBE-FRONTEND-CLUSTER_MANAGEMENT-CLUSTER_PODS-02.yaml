product: 在集群级容器组列表刷新当前搜索结果，不重置搜索条件。
preconditions:
- 已登录，且对 host 集群有读取权限
steps:
- 打开容器组列表并输入一个唯一的不存在的名称
- 等待列表进入空态
- 点击刷新并等待容器组请求完成
expected:
- 发出新的容器组列表请求并成功返回
- 搜索条件保持不变，列表仍显示空态
troubleshoot:
- 没有请求：检查刷新按钮是否接到当前查询的 refetch
- 搜索条件丢失：检查刷新是否重置了列表状态
update_automation:
