story:
- US9

product: 概览页签自上而下四个分区：① 集群状态行（节点在线环图、XPU 厂商构成环图、组件状态 3×2 磁贴）；② 集群资源用量（左侧 7 行当前值 used/total，右侧一张可选指标的大图）；③ RDMA 状态（health / 端口 / 吞吐 / 错误 4 个互斥指标页签，各带当前值与曲线，另按端口清单列出异常节点）；④ 服务组件监控（延迟 / 请求速率 / 调度尝试 / 尝试速率 4 个互斥页签，各带当前值与曲线）。RDMA 与服务组件两块复用旧的图表面板形态；RDMA 端口清单用路径集群段独立读取；概览不再有「查看 RDMA 趋势」按钮。
preconditions:
- 已登录 admin，集群 host 已就绪
- componenthealth、nodes/stats 可读；监控 range query 可用；components/apiserver 与 components/scheduler 可读
- RDMA 端口清单接口 /kapis/clusters/<cluster>/rdma.kubesphere.io/v1alpha1/ports 可访问（本部署可能 404，按不可用分支断言）
steps:
- 用 API 读取 componenthealth 的 nodeStatus、nodes/stats 的厂商计数；用一次 range 查询读契约 §4 的 7 组成对指标与 RDMA 4 组指标（health / port_up / port_total / tx / rx / rx_errors / retrans）；读取 components/apiserver 与 components/scheduler 的序列（保留 verb / result 身份）；读取 RDMA 端口清单
- 打开 /kube-frontend/clusters/host/monitor（overview 页签），等待 cluster-monitor:surface 就绪
- 核对四个分区按顺序出现：cluster-monitor:status → cluster-monitor:overview:usage → cluster-monitor:overview:rdma → cluster-monitor:overview:components（用 getBoundingClientRect 的 y 递增），且状态行三块可见
- 核对用量列表恰好 7 行、key 顺序为 gpuMemory / gpu / gpuAllocated / cpu / memory / disk / pods；逐行读 :overview:usage:<key>:value 与 API used/total 交叉核对；核对右侧主图有坐标轴与图例，切换左侧指标后主图变化
- 核对 RDMA 状态块：cluster-monitor:overview:rdma 可见，:rdma:tabs 内 4 个页签顺序为 health → ports → throughput → errors；逐个页签读 :rdma:tab:<key>:value 并核对格式（health 为百分比；ports 为两个整数；throughput 为两个字节/秒；errors 为两个整数），用 API 序列核对数值
- 核对 :rdma:chart 的 data-ai-state 为 ready、有坐标轴/图例/:chart:now，图例与当前页签的序列一一对应；点其它页签后图与图例切换到该页签的指标
- 核对端口清单分支：API 读取失败时 :rdma:inventory-unavailable 可见且不出现「均正常」；API 成功时按端口 healthy 统计异常节点——有异常则 :rdma:abnormal 列出这些节点（:rdma:abnormal:<node> 含 down/total），无异常则 :rdma:no-abnormal 可见
- 断言概览不存在 cluster-monitor:overview:view-rdma（「查看 RDMA 趋势」按钮已删除）
- 核对服务组件监控块：:overview:components 可见，:components:tabs 内 4 个页签顺序为 latency → requestRate → attempts → attemptRate；逐个页签读 :components:tab:<key>:value 并核对单位（latency 为 ms 两位小数；requestRate / attemptRate 为次/秒两位小数；attempts 为整数）
- 读取 :components:chart 的图例身份，与 API 的 verb / result 集合比对：latency 含总平均 + 按 verb 的线；attempts / attemptRate 按 result 一线；身份不按返回顺序配对；核对 :components:chart 有坐标轴、图例与 :chart:now
- 用 page.route 让 components/apiserver 返回 200 且 results 为空，切一次时间窗触发重取：核对服务组件块的 :components:chart:empty 显示「本集群未上报该组件指标」类说明且不显示 0；移除拦截后恢复
- 用 page.route 让概览 range 查询返回 200 且 results 为空，重新打开页签：核对 RDMA 4 个页签当前值为 «-»、:rdma:chart:empty 可见且无零线；用量 7 行显示 «-»、主图 :usage-chart:empty；服务组件块不受概览查询影响（其查询独立）
expected:
- 概览四分区顺序固定（状态行 → 资源用量 → RDMA 状态 → 服务组件监控）；状态行三块、用量 7 行与主图、两块各 4 页签与曲线齐全
- 用量当前值与 API used/total 一致；比率类按百分比显示、缺失显示 «-»
- RDMA：4 页签顺序与单位正确（health % 一位小数、ports 整数对、throughput B/s 对、errors 整数对）；数值与 API 一致；图有轴/图例/当前值，切换页签切图
- 端口清单：失败只显示「RDMA 端口清单不可用」，不显示「均正常」；成功且异常时列出异常节点与 down/total；全正常时显示「所有 RDMA 端口均正常。」
- 服务组件：4 页签顺序与单位正确；latency 含总平均 + 按 verb 的多条线，attempts / attemptRate 按 result 一线，身份不混淆；空序列显示未上报说明而不是 0
- 概览不再有 :overview:view-rdma；RDMA 明细趋势仍只从物理资源监控页签进入
- 概览无数据时 RDMA 页签显示 «-» 与 :rdma:chart:empty、不画零线；服务组件块的空态由自己的组件查询决定
troubleshoot:
- RDMA 4 页签只剩数字或没有图：块被退化成摘要，检查 ClusterOverviewRdmaBlock 是否渲染 TrendChart
- 端口清单显示「均正常」但 API 失败：把清单失败当成了无异常，检查 inventory.isError 分支
- 成员集群端口清单为 1 条（host 的数字）：用了 ?cluster= 而不是路径集群段 /kapis/clusters/<c>/...
- 服务组件块延迟线只有一条：身份被按位置合并，检查是否复用 toComponentCharts 的 verb 合并
- 服务组件块尝试次数显示成小数：把累积计数当成了速率
- 点「查看 RDMA 趋势」还能跳转：按钮未删除，应只保留块内 4 页签与物理资源页签入口
update_automation:
- 概览分区：cluster-monitor:status / :overview:usage / :overview:rdma / :overview:components
- 用量：cluster-monitor:overview:usage / :overview:usage:<key>[:value] / :overview:usage-chart[:legend|:empty]
- RDMA 块：cluster-monitor:overview:rdma / :rdma:tabs / :rdma:tab:<health|ports|throughput|errors>[:value] / :rdma:chart[:now|:empty] / :rdma:chart:legend / :rdma:legend:<metric> / :rdma:no-abnormal / :rdma:abnormal / :rdma:abnormal:<node> / :rdma:inventory-unavailable
- 服务组件块：cluster-monitor:overview:components / :components:tabs / :components:tab:<latency|requestRate|attempts|attemptRate>[:value] / :components:chart[:now|:empty] / :components:chart:legend / :components:legend:<line> / :components:retry
- 状态行：cluster-monitor:status / :overview:node-ring[:value] / :overview:vendor-donut / :overview:vendor:<vendor>
