id: TC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-CLUSTER_CONFIG-03
level: 3
suite: point
module: kube-frontend
submodule: cluster-management
feature: cluster-config
title: 集群级配置字典 · 行操作（编辑信息 / 删除，联邦对象无操作）
entry_url: '{BASE_URL}/kube-frontend/clusters/{CLUSTER}/configmaps'
prd: prd/kube-frontend/cluster-management/cluster-config.md
design: design/kube-frontend/cluster-management/cluster-config.md

covers:
- AC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-CLUSTER_CONFIG-03

story:
- US1

product: 集群级配置字典列表的普通行提供「编辑信息 / 编辑 YAML / 编辑设置 / 删除」，写按该行自己的项目寻址；联邦托管对象不渲染操作。
preconditions:
- 已登录，host 集群，admin
- 用例在 default 项目创建一个唯一命名的配置字典，结束后删除
steps:
- 用 API 创建配置字典 tc-e2e-cm-<stamp>（带 kubesphore 描述注解）
- 打开 /kube-frontend/clusters/host/configmaps，用搜索框收窄到该名称
- 打开该行的更多操作，核对四项动作
- 点「编辑信息」，修改描述并保存，等弹窗关闭
- 用 API 回读该对象的 kubesphore 描述注解，核对已更新
- 再次打开更多操作，点「删除」，在确认弹窗输入名称并确认
- 等该行消失；用 API 确认对象已不存在
expected:
- 行操作四项齐全，顺序为 编辑信息 / 编辑 YAML / 编辑设置 / 删除
- 编辑信息保存后注解被更新（按行所属项目寻址，不是页面的空命名空间）
- 删除确认后对象从列表与 API 中消失
- 联邦托管行（若有）不渲染更多操作按钮
troubleshoot:
- 保存没反应：写入打到了没有 namespaces 段的路径（404）；看 Network 的 URL
- 删除后对象还在：DELETE 少了命名空间段，或确认文本没输入正确
update_automation:
- 行 data-ai-row=<namespace>/<name>；更多操作按钮 aria-label「更多操作」
