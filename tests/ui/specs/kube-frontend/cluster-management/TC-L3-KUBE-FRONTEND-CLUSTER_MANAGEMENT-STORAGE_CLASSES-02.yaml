- 核对 URL 与基本信息
- 核对驱动参数区（有参数时列出，无参数时说明）
expected:
- 详情页可达且 ready
- 供应者、回收策略、绑定模式与对象一致
- 能力开关显示为「是/否」
troubleshoot:
- 显示原始 key：新增文案后未重新构建前端包
- 参数区为空但对象有 parameters：读取的是列表行而非对象
- 绑定模式显示空：字段在 spec 顶层而不是 parameters 里
