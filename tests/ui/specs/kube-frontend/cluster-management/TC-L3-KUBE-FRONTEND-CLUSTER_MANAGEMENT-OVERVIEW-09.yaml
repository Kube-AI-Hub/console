steps:
- 打开概览，核对没有目标查询和WebSocket
- 点击一次，核对页面不跳转，终端接收真实输出
- 执行唯一标记和只读版本命令，关闭释放
- 重新打开重新解析，准备时取消，核对不会晚到重开
- 模拟403，核对无重试且可关闭
expected:
- 无二次准备按钮，原生终端与近全屏交互保留
- 关闭取消请求并销毁连接，403不绕权限，不创建Pod
