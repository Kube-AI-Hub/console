id: TC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-GATEWAY_DETAIL-05
level: 3
suite: point
module: kube-frontend
submodule: cluster-management
feature: gateway-detail
title: 网关详情控制器监控
entry_url: '{BASE_URL}/kube-frontend/clusters/host/gateways/{name}'
prd: prd/kube-frontend/cluster-management/gateway-detail.md
design: design/kube-frontend/cluster-management/gateway-detail.md

covers:
- AC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-GATEWAY_DETAIL-05

story:
- US1

product: 网关详情新增「监控」区块：通过 Prometheus 查询控制器容器的 CPU/内存；若部署上报 ingress 指标则追加请求速率与 5xx 速率，否则明确说明「未上报 ingress 指标」；查询失败显示不可用。
preconditions:
- 已登录 admin；host 集群存在集群网关，Prometheus 可查询控制器容器指标
- 只读用例
steps:
- 打开集群网关详情，滚动到「监控」区块
- 断言 CPU/内存卡片出现且数值可读
- 断言 ingress 指标缺失时显示明确说明（本部署 controller 未暴露 nginx_ingress_controller_requests）
expected:
- CPU/内存用 PromQL instant 查询（controller 容器），失败降级不可用
- ingress 指标存在时显示请求/5xx 速率；不存在时提示未上报，不画空图
- 区块只读
troubleshoot:
- 指标为空：检查 pod 正则与 container=controller 标签
- 区块不可用：检查 BFF 到 prometheus-k8s 代理是否可达
update_automation:
- 句柄：gateway-detail:monitoring/monitor-cpu/monitor-memory/monitor-requests/monitor-errors/monitor-ingress-unavailable/monitor-unavailable
