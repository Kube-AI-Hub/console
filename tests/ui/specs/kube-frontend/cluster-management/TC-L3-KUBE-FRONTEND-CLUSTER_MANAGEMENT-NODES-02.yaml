story:
- US1

product: 节点列表显示 CPU 与内存使用率百分比，取值来自节点监控比率。
preconditions:
- 已登录，且有集群权限
- 集群可访问 monitoring.kubesphere.io（不可用时降级为 -）
steps:
- 打开节点列表并捕获本次节点监控响应
- 读取 CPU 使用率与内存使用率单元格
expected:
- 表头含「CPU 使用率」「内存使用率」
- 每格为 0–100 的整数百分比，或为 -（指标不可用）
- 百分比与 API 数值相符（允许四舍五入差 1）
troubleshoot:
- 全部为 - 时检查节点监控 API 和采样
- 百分比与原始比率相差百倍时检查乘 100 的换算
update_automation:
- 列变化时改 pages/cluster_management.py
