- AC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-NETWORK_POLICIES-03

story:
- US1

product: 跨项目列出 NetworkPolicy，带「项目」列；空态指向项目内的「网络隔离」；行内名称链接到所属项目的网络隔离页。
preconditions:
- 已登录平台管理
steps:
- 打开集群网络策略页
- 核对列：名称、项目、策略类型、规则数、创建时间
- 若存在策略：点击第一行名称，确认进入该项目的网络隔离页
- 若不存在：确认空态说明「策略在项目内创建」
expected:
- 列表或空态渲染，且一定有「项目」列
- 链接包含企业空间与项目段
performance:
- 一次列表 + 一次命名空间映射读取
troubleshoot:
- 页签为空：registry 的 path 与路由目录不一致
- 链接拼错：namespace→workspace 映射缺失时应回退 public
update_automation:
- 列变化时同步 ClusterNetworkPoliciesPage 与用例
