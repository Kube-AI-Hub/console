title: 集群监控 · 系统组件未上报、请求失败与无权限分支
entry_url: '{BASE_URL}/kube-frontend/clusters/host/monitor'
prd: prd/kube-frontend/cluster-management/monitor.md
design: design/kube-frontend/cluster-management/monitor.md

covers:
- AC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-MONITOR-07

story:
- US5

product: etcd 恢复为条件页签（旧 requireETCD 的页内形态）：ServiceMonitor kubesphere-monitoring-system/etcd 探测为 200 时页签条末尾出现 etcd 页签，404 或探测失败时隐藏，隐藏时访问 ?tab=etcd 回退概览。etcd 组件返回 200 但无序列时页内显示「本集群未上报该组件指标」说明而不是 0 值卡片；组件请求 5xx 显示错误与重试、403 只说明无权限不给重试；一个组件失败不影响其它页签。
preconditions:
- 本部署 ServiceMonitor 探测为 404，etcd 页签隐藏；可用 page.route 模拟 200 覆盖 etcd 页内分支
- 本部署 components/etcd 返回 200 但每条指标 0 条序列
- 监控后端可用，apiserver/scheduler 组件有数据
steps:
- 打开集群监控，核对页签条为基础 5 项（overview/resource/apiserver/scheduler/ranking）且没有 cluster-monitor:tab:etcd
- 直接访问 ?tab=etcd，核对回退 overview（cluster-monitor:tabpanel:overview 可见、当前页签为 overview）
- 用 page.route 让 servicemonitors/etcd 返回 200，重新打开页面，核对 etcd 页签出现
- 点 etcd 页签，核对 cluster-monitor:etcd:no-data 文案含「未上报」类说明，且没有 0 值卡片或曲线
- 让 components/etcd 返回 500，重进 etcd 页签，核对错误面板与重试按钮；点重试确认重新请求；再切到 apiserver 页签确认不受影响
- 让 components/etcd 返回 403，核对无权限文案且没有重试按钮
- 移除拦截后重新打开页面，核对 etcd 页签再次隐藏、页签条恢复基础 5 项
expected:
- 404 时页签条不含 etcd；访问 ?tab=etcd 回退概览且不报错
- 200 时出现 etcd 页签；无序列时页内显示「本集群未上报该组件指标」类说明与可能原因，不渲染 0 值卡片、不画曲线、也不整组消失
- 5xx 时显示错误说明与重试按钮，点击会重新请求；403 时显示无权限说明且没有重试按钮
- 无数据、错误、无权限三种画面互不顶替；etcd 失败不影响 apiserver/scheduler 页签
troubleshoot:
- etcd 显示 0：把 0 条序列当成了 0 值
- 403 也出现重试按钮：ResourceErrorPanel 的 isPermission 分支未生效
- 访问 ?tab=etcd 报错或停在不可见页签：条件页签隐藏时应回退 overview
- 找不到 etcd 句柄：cluster-monitor:tab:etcd / :tabpanel:etcd / :etcd:no-data / :etcd:retry
update_automation:
- 页签：cluster-monitor:tab:etcd、cluster-monitor:tabpanel:etcd（仅 ServiceMonitor 200 时存在）
- 页内分支：cluster-monitor:etcd:no-data / :etcd:retry / :etcd:chart:<key>、resource-error
- 改 pages/cluster_monitor.py 与条件 etcd 页签实现
