submodule: cluster-management
feature: monitor
title: 集群监控 · 系统组件未上报、请求失败与无权限分支
entry_url: '{BASE_URL}/kube-frontend/clusters/host/monitor'
prd: prd/kube-frontend/cluster-management/monitor.md
design: design/kube-frontend/cluster-management/monitor.md

covers:
- AC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-MONITOR-07

story:
- US5

product: 组件指标「没有序列」显示本集群未上报的说明而不是 0 或空白表格；请求失败显示错误与重试，无权限（403）只说明不提供重试；一个组件失败不影响其余组件。
preconditions:
- 本部署 components/etcd 返回 200 但每条指标 0 条序列
- 监控后端可用，apiserver/scheduler 组件有数据
steps:
- 打开集群监控，等 cluster-monitor:group:etcd 进入 empty
- 读取 etcd 子组说明文案与卡片数量
- 用 page.route 让 components/scheduler 返回 403，切换时间窗触发重取，等该子组进入 error
- 确认无权限文案存在，且没有重试按钮；apiserver 子组仍为 ready
- 换成 500 响应，切换时间窗，确认错误说明与重试按钮；点重试确认发起新请求
- 移除拦截后再点重试，确认子组恢复 ready
expected:
- etcd 子组显示「本集群未上报该组件指标」类说明与可能原因；不渲染 0 值卡片、不显示空白表格、不整组消失
- 403 时显示无权限说明且没有重试按钮；500 时显示错误说明与重试按钮，点击会重新请求
- 移除失败后重试成功，子组恢复为卡片；无数据、错误、无权限三种画面互不顶替
troubleshoot:
- etcd 显示 0：把 0 条序列当成了 0 值，检查 group 的 empty 分支
- 403 也出现重试按钮：ResourceErrorPanel 的 isPermission 分支未生效
- 切换时间窗后没有重取：组件 query key 缺 window/start/end
update_automation:
- 句柄：cluster-monitor:components:not-reported:<component> / cluster-monitor:components:retry:<component> / cluster-monitor:group:<component>[data-ai-state]
