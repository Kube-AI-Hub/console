id: TC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-CLUSTER_MEMBERS-01
level: 3
suite: point
module: kube-frontend
submodule: cluster-management
feature: cluster-members
title: 集群成员 · 谁持有集群角色
entry_url: '{BASE_URL}/kube-frontend/clusters/host/members'
prd: prd/kube-frontend/cluster-management/cluster-members.md
design: design/kube-frontend/cluster-management/cluster-members.md

covers:
- AC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-CLUSTER_MEMBERS-01

story:
- US1

product: 集群设置下的集群成员页：用户名、状态、集群角色、最近登录四列；只读。
preconditions:
- 已登录，且对 host 集群有读取权限
- 集群至少有一个成员（通常有 admin）
steps:
- 用 API 读取 clustermembers
- 打开集群成员页
- 核对四列与行数
- 核对首个成员的角色与注解一致
expected:
- 页可达且 ready
- 行数等于接口返回数
- 集群角色列等于 iam.kubesphere.io/clusterrole 注解
troubleshoot:
- 行数为 0：读的是 clusterrolebindings（404）而不是 clustermembers
- 角色列为空：注解键写成 globalrole
- 侧栏没有入口：registry 未注册（注意项目级 members 已存在）
update_automation:
- 选择器见 pages/cluster_management.py 与 ClusterMembersPage.tsx
