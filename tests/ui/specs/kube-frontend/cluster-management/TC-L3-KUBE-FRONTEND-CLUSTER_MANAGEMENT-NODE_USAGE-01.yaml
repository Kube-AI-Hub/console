product: 节点用量页服务端分页展示九类排行指标及容器组数，直接进入默认 CPU 降序；比率乘100，load1 不换算，GPU 分配按卡数排序但展示分配率。
preconditions:
- 已登录，且对集群 host 有读取权限
- 监控后端返回节点指标
steps:
- 捕获页面同次 type=rank 响应，记下当前页节点与 CPU 比例
- 打开节点用量页，等待 surface 就绪
- 核对行数与当前页一致，总数来自 total_item
- 读取每行的三个使用率，核对都是 0-100 的整数
- 核对首行 CPU 使用率等于接口算出的最大值（乘 100 后取整）
expected:
- 行数与同次服务端当前页一致
- 所有使用率为 0-100 的整数百分比（出现 0% 而接口为 0.6 说明没乘 100，出现 61% 而接口为 0.6 说明乘对了）
- 首行是 CPU 最高的节点
troubleshoot:
- 全部显示 0%：比例没有乘 100
- 出现大于 100：把容器组数也当比例乘了 100
- 行数与当前页不一致：检查 type=rank、page/limit 和按 node 身份合并
- 排序不对：默认 sort_metric=node_cpu_utilisation、sort_type=desc
update_automation:
- 列或标识变化时改 pages/cluster_management.py 与 NodeUsagePage.tsx
