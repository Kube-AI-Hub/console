title: 流水线详情 · 基本信息与运行记录
entry_url: "{BASE_URL}/kube-frontend/clusters/host/devops"
prd: prd/kube-frontend/cluster-management/devops-projects.md
design: design/kube-frontend/cluster-management/devops-projects.md

covers:
- AC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-DEVOPS_PROJECTS-03

story:
- US3

product: DevOps 工程详情的流水线行可进入流水线详情：基本信息（名称/类型/状态/创建时间/工程命名空间）+ 运行记录区（编号/状态/开始时间/耗时），运行记录独立显示表格/空态/失败+重试；流水线不存在时显示 not-found 且运行记录区仍可读；页面只读。
preconditions:
- 已登录，且 devopsprojects/pipelines/pipelineruns 可读（当前 0 条流水线，不存在流水线为主路径）
- 只读用例；错误态通过拦截 pipelineruns 请求构造
steps:
- 用 API 读 devopsprojects 与目标命名空间下的 pipelines，确定要打开的工程与流水线（不存在时用 tc-e2e-missing 名称）
- 拦截 pipelineruns 列表返回 422，打开流水线详情 URL
- 读取页面状态：存在流水线时核对基本信息，不存在时核对 :not-found
- 读取运行记录区：失败原因 + 重试按钮
- 解除拦截并点击重试，读取运行记录的空态或表格
- 工程与流水线都存在时，从工程详情流水线页签点击行链接进入详情
expected:
- 页面外壳 pipeline-detail:surface 可达，data-ai-state 离开 loading
- 流水线存在时 pipeline-detail:basic 显示名称/类型/状态/创建时间/命名空间；不存在时 pipeline-detail:not-found 可见
- 运行记录区先显示 pipeline-detail:runs-error 与 runs-retry（含拦截消息）；解除拦截重试后显示 runs-empty 或 runs-table 之一，错误消失
- 表格列头为 编号 / 状态 / 开始时间 / 耗时；空态文案为「该流水线还没有运行记录。」
- 流水线行链接的 href 指向 …/devops/<工程>/pipelines/<流水线>；详情页没有运行/重跑/停止入口
troubleshoot:
- 运行记录 404：不要用 pipelines/<name>/pipelineruns（原生 API 不存在该子资源），读 namespaces/<ns>/pipelineruns
- 运行记录状态空白：状态在注解 devops.kubesphere.io/jenkins-pipelinerun-status（JSON），不在 status
- 命名空间读错：命名空间来自工程 status.adminNamespace，缺失时回退工程名
- 页签/详情 404：路由需要 devops/$name/{route,index}.tsx 布局渲染 Outlet
update_automation:
- 选择器：pipeline-detail:surface/not-found/basic/runs/runs-table/runs-empty/runs-error/runs-retry，行 data-ai-row=<runId>，工程详情链接 devops-detail:pipeline:<name>
