covers:
- AC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-CLUSTER_LIST-03

story:
- US4

product: 非主集群可从行操作「移除集群」，需输入集群名确认；移除后 Cluster 对象不存在，列表不再包含它；主集群行没有该操作。
preconditions:
- 已登录平台管理
- 用例先创建一个临时 proxy 集群对象（tc-e2e- 前缀），finally 中确保删除
steps:
- 用 API 创建一个临时 proxy 集群
- 打开集群列表，定位该集群行
- 打开行操作菜单，点「移除集群」
- 核对确认按钮在输入名称前不可用
- 输入集群名并确认
- 用 API 回读该集群对象
- 核对主集群行没有「移除集群」
expected:
- 确认按钮只有在输入名称后才可用
- 移除后回读该对象为 404，列表不再包含它
- 主集群行没有「移除集群」入口
troubleshoot:
- 移除后仍能读到：确认删的是集群对象而不是其它资源
- 出现「移除集群」在主集群上：角色判定应来自 cluster-role.kubesphere.io/host 标签
- 对话框无法确认：输入必须与对象名完全一致
update_automation:
- 选择器见 pages/cluster_fleet.py 与 MultiClusterListPage.tsx
