id: TC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-MONITOR-05
level: 3
suite: point
module: kube-frontend
submodule: cluster-management
feature: monitor
title: 集群监控 · GPU / 磁盘 I/O / RDMA 面板与单位
entry_url: '{BASE_URL}/kube-frontend/clusters/host/monitor'
prd: prd/kube-frontend/cluster-management/monitor.md
design: design/kube-frontend/cluster-management/monitor.md

covers:
- AC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-MONITOR-05

story:
- US1

product: 物理资源监控页签按 GPU / 主机资源 / 磁盘 I/O / 网络 / RDMA 五组渲染，共 18 张多序列大图；旧页按卡拆分的读写吞吐、读写 IOPS、网络收发、Pod 三态、负载 1/5/15、RDMA 端口/吞吐/错误合并为同一张图的不同身份序列。GPU 与健康度为 0–1 比值×100，链路速率 bit/s→Gb/s，IOPS 两位小数，无数据给空态说明。
preconditions:
- 监控后端可用（/kapis/monitoring.kubesphere.io/v1alpha3/cluster 返回指标）
- 页面默认时间窗为最近 1 小时
steps:
- 打开集群监控，点「物理资源监控」页签（cluster-monitor:tab:resource），等 cluster-monitor:resource 就绪
- 核对五个分组标题与顺序为 GPU → 主机资源 → 磁盘 I/O → 网络 → RDMA
- 核对图表总数为 18（gpu 3 + host 6 + disk 2 + network 1 + rdma 6）
- 逐图核对 GPU、磁盘吞吐/IOPS、网络流量与 RDMA 图的图例或空态说明
- 用接口同一窗口序列核对 GPU 显存=比值×100、RDMA 端口 up/total、链路速率显示为 Gb/s；吞吐为 B/s、IOPS 两位小数、错误类为整数
expected:
- 五个分组齐全且顺序正确；共 18 张图，多序列图按身份一条线（负载 3、Pod 三态 3、磁盘读写 2、网络收发 2、RDMA 端口/吞吐/错误）
- GPU 显存/使用率与 RDMA 健康度为 0–100 百分比；已分配卡数、端口、错误/重传/丢弃/链路中断为整数
- 链路速率形如 '907.5 Gb/s'（一位小数），不是原始 bit/s 大整数
- 磁盘/网络/RDMA 吞吐为 B/KiB/MiB/GiB 每秒；IOPS 两位小数
- 任一图无数据时显示空态说明（<chart>:empty）而不是 0 或零线
troubleshoot:
- 数值显示成 0–1：忘了 ×100（GPU/健康度是比值）
- 链路速率显示 907500000000.00：把 bit/s 当成普通小数，未用 Gb/s 格式
- 图数量或分组不对：多序列被按卡拆分、或组顺序错了；检查 monitorResourceCharts.ts 与 cluster-monitor:resource:chart:<group>:<key>
update_automation:
- 页签/分组：cluster-monitor:tab:resource、cluster-monitor:resource:group:<gpu|host|disk|network|rdma>
- 图表：cluster-monitor:resource:chart:<group>:<key>，图例值位于 <chart>:legend:<series>:value，空态位于 <chart>:empty
- 分组与单位配置：monitorResourceCharts.ts
