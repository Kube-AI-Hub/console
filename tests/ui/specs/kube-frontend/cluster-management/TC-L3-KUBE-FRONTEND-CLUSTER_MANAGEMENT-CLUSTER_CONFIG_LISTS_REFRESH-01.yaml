id: TC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-CLUSTER_CONFIG_LISTS_REFRESH-01
level: 3
suite: point
module: kube-frontend
submodule: cluster-management
feature: cluster-config-lists-refresh
title: 集群配置与资源列表刷新
entry_url: '{BASE_URL}/kube-frontend/clusters/host/components'
prd: prd/kube-frontend/cluster-management/cluster-config-lists-refresh.md
design: design/kube-frontend/cluster-management/cluster-config-lists-refresh.md

covers:
- AC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-CLUSTER_CONFIG_LISTS_REFRESH-01

story:
- US1

product: 集群的服务账号、网络策略、组件与 IP 池四个列表提供刷新入口，刷新保留筛选与排序。
preconditions:
- 已登录且有集群管理员权限
steps:
- 依次打开服务账号、网络策略、组件、IP 池页面，确认各自的刷新入口存在且可用
- 在组件页选择一种类型后点击刷新，观察请求是否重新发起
steps_expected:
- 四个页面的刷新入口存在且空闲时可用
- 点击后重新发起对应查询，且组件页的筛选保持不变
expected:
- 刷新期间按钮忙碌；返回后恢复
troubleshoot:
- 按钮永久禁用：schema 依赖数组缺少 isFetching
- 刷新后筛选被清空：刷新走了列表状态重置
update_automation:
- 选择器：cluster-serviceaccounts:refresh / cluster-networkpolicies:refresh / components:refresh / ip-pools:refresh
