preconditions:
- 已登录，且有集群权限

steps:
- 打开节点页
- 确认页面没有项目工作区栏
- 切到项目页签
- 再切回节点
- 统计切换期间的文档请求

expected:
- 两个页面各自出现列表或空态
- 页面不出现 data-ai-id=workspace-bar
- 切换后对应页签高亮
- 切换期间文档请求为 0

troubleshoot:
- 出现工作区栏说明集群页复用了项目布局
- 出现文档请求说明页签退化成整页跳转

