id: TC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-CLUSTER_CONFIG-02
level: 3
suite: point
module: kube-frontend
submodule: cluster-management
feature: cluster-config
title: 集群侧列表每页条数选择器（10/20/50/100）
entry_url: '{BASE_URL}/kube-frontend/clusters/host/configmaps'
prd: prd/kube-frontend/cluster-management/cluster-config.md
design: design/kube-frontend/cluster-management/cluster-config.md

covers:
- AC-L3-KUBE-FRONTEND-CLUSTER_MANAGEMENT-CLUSTER_CONFIG-02

story:
- US1

product: 集群侧六个列表（配置字典/保密字典/服务账号/网络策略/IP 池/持久卷声明）与存储类列表都提供每页条数选择器；切换后请求以新的 limit 与 page=1 重发，表格行数与响应一致。
preconditions:
- 已登录；集群 host 可读
steps:
- 依次打开六个集群列表，核对每页条数选择器显示默认值（20 或 10）
- 每个页面选择 50，等 surface 离开 loading 后记录请求与行数
- 打开集群存储类列表（客户端分页），选择 50 后核对只显示当前页的行
expected:
- 每页都有 <前缀>:page-size 选择器且可选 10/20/50/100
- 选择 50 后出现 limit=50 且 page=1 的请求（证明页大小进了查询键）
- 行数等于该次响应条数（≤50），选择器显示 50
troubleshoot:
- 选择器显示 50 但行数不变、也没有新请求：页大小没进 queryKey
- 存储类列表显示全部行：客户端分页没有按页切片
update_automation:
- 句柄：cluster-configmaps:page-size / cluster-secrets:page-size / cluster-serviceaccounts:page-size / cluster-networkpolicies:page-size / ip-pools:page-size / cluster-pvc:page-size / storageclasses:page-size
