title: 集群配置字典 · 与 kubectl 逐项核对
entry_url: "{BASE_URL}/kube-frontend/clusters/host/configmaps"
prd: prd/kube-frontend/cluster-configmaps/_index.md
design: design/kube-frontend/cluster-configmaps/_index.md

