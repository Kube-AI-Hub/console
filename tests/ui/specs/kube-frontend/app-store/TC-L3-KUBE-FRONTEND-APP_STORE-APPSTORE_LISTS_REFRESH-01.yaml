id: TC-L3-KUBE-FRONTEND-APP_STORE-APPSTORE_LISTS_REFRESH-01
level: 3
suite: point
module: kube-frontend
submodule: app-store
feature: appstore-lists-refresh
title: 应用商店列表刷新
entry_url: '{BASE_URL}/kube-frontend/workspaces/system-workspace/apps'
prd: prd/kube-frontend/app-store/appstore-lists-refresh.md
design: design/kube-frontend/app-store/appstore-lists-refresh.md

covers:
- AC-L3-KUBE-FRONTEND-APP_STORE-APPSTORE_LISTS_REFRESH-01

story:
- US1

product: 企业空间的应用与仓库列表提供刷新入口；商店管理页保留其页面级刷新且不出现第二个按钮。
preconditions:
- 已登录且可读企业空间应用商店
steps:
- 打开企业空间应用列表，确认刷新入口可用并点击，观察请求
- 打开仓库列表，确认刷新入口存在且可用
- 打开商店管理页，确认只有原有的页面级刷新按钮
steps_expected:
- 两个列表的刷新入口存在且空闲时可用
- 点击应用列表刷新会重新发起请求
- 商店管理页刷新按钮数为 1
expected:
- 刷新期间按钮忙碌；返回后恢复
troubleshoot:
- 仓库页没有按钮：schema 缺 refresh 条目（只有 onRefresh 不足以渲染按钮）
- 商店管理页两个刷新：重复接入
update_automation:
- 选择器：workspace-apps:refresh / workspace-repos:refresh / store-manage:<view>:refresh
