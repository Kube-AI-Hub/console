story:
- US1

product: /apps-manage 重定向到 /store；三个页签「应用/分类/审核」各自渲染列表或空态；有刷新按钮。
preconditions:
- 已登录平台管理
steps:
- 打开 /kube-frontend/apps-manage，确认 URL 落到 /store
- 依次切到「分类」「审核」页签
- 在每个页签确认表格或空态，并确认刷新按钮存在
expected:
- URL 重定向到 /apps-manage/store
- 三个页签都在，且切换不刷新整页
- 每个页签都有可见内容（列表或空态）
performance:
- 每个页签一次接口
troubleshoot:
- 页签为空：areaOfPage 的 segment 与 registry path 不一致
- 刷新无效：按钮用 location.reload，整页刷新属预期
update_automation:
- 页签增减时同步 registry 与用例
