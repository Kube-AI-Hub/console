id: TC-L3-KUBE-FRONTEND-APP_STORE-CRD_APPS-06
level: 3
suite: point
module: kube-frontend
submodule: app-store
feature: crd-apps
title: 自制应用详情事件
entry_url: '{BASE_URL}/kube-frontend/system-workspace/clusters/host/projects/default/applications/composing'
prd: prd/kube-frontend/app-store/crd-apps.md
design: design/kube-frontend/app-store/crd-apps.md

covers:
- AC-L3-KUBE-FRONTEND-APP_STORE-CRD_APPS-07

story:
- US3

product: 自制应用详情展示与该应用及其组件相关的事件（按 involvedObject.name 过滤命名空间事件，含 pod 前缀事件），按时间倒序；无事件时明确空态。
preconditions:
- 已登录 admin；项目 default 可用；用例自建 Application+Deployment，finally 清理
steps:
- API 创建临时 Application 与 Deployment（触发 ScalingReplicaSet 事件）
- 打开详情，滚动到「事件」区块
- 断言事件表出现且包含该 Deployment 的事件；无事件时显示空态（正常情况下不应发生）
- finally 删除 Deployment/Application
expected:
- 事件只包含该应用/组件/pod 前缀相关对象，按最后时间倒序
- 事件读取失败显示错误与重试；无事件显示空态
- 事件是只读区块
troubleshoot:
- 表为空：确认命名空间 events 有该 deployment 的 involvedObject，且名称在组件列表/前缀内
- 显示无关事件：检查过滤条件是否只按 involvedObject.name
update_automation:
- 句柄：composed-app-detail:events/events-table/event:<i>/events-empty/events-retry
