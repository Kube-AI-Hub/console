title: 自制应用详情链路追踪
entry_url: '{BASE_URL}/kube-frontend/system-workspace/clusters/host/projects/default/applications/composing'
prd: prd/kube-frontend/app-store/crd-apps.md
design: design/kube-frontend/app-store/crd-apps.md

covers:
- AC-L3-KUBE-FRONTEND-APP_STORE-CRD_APPS-10

story:
- US3

product: 自制应用详情展示该应用 Service 的链路样本（traceID/服务/span 数/耗时）；有样本时可按行展开 span 瀑布（起点/耗时相对条）；无样本显示空态，tracing 不可用显示未上报而不是空表。
preconditions:
- 已登录 admin；项目 default 可用；用例自建 Application+Deployment+Service，finally 清理
steps:
- 创建临时应用与 Service，打开详情
- 滚动到「链路追踪」区块，等待请求结束
- 断言区块可见，并显示空态（本部署 tracing 返回 200/空）或未上报说明
- 用契约 mock 返回一条含 2 个 span 的 trace，刷新后断言表格、展开、两个 span 瀑布行
expected:
- 有 trace 时显示表格（traceID/服务/span 数/耗时），展开后按 span 起点/宽度画条
- 无样本与模块不可用分开；失败显示错误与重试
- 区块只读
troubleshoot:
- 一直 loading：检查 /services/<svc>/traces 返回 200 空数组
- 表格出现无关 trace：确认只请求应用 Service
update_automation:
- 句柄：composed-app-detail:tracing/tracing-empty/tracing-unavailable/tracing-table/trace:<id>/trace-toggle:<id>/trace-spans:<id>/trace-span:<spanId>/tracing-retry
