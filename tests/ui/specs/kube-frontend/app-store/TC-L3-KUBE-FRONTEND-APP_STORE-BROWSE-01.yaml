story:
- US1

product: 应用商店首页：左侧分类栏（含应用数）与右侧应用区；商店为空时说明应用来自应用仓库；页头有「商店管理」入口。
preconditions:
- 已登录
steps:
- 打开 /kube-frontend/apps
- 确认分类栏含「全部分类」
- 若商店为空：确认空态说明来源是应用仓库
- 点击「商店管理」
expected:
- 页面进入 ready 或 empty 状态（不是 error）
- 空态文案包含「应用仓库」
- 跳转到 /kube-frontend/apps-manage
performance:
- 两次接口：分类（全量）+ 应用（一页）
troubleshoot:
- 仍为空白：/kube-frontend/apps 路由缺失（曾长期如此）
- 状态 error：openpitrix 接口不可用
update_automation:
- 空态文案变化时同步用例断言
