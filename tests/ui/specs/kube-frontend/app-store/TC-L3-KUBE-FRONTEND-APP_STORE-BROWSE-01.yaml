title: 商店浏览 · 分类栏、空态与商店管理入口
entry_url: '{BASE_URL}/kube-frontend/apps'
prd: prd/kube-frontend/app-store/browse.md
design: design/kube-frontend/app-store/browse.md

covers:
- AC-L3-KUBE-FRONTEND-APP_STORE-BROWSE-01
