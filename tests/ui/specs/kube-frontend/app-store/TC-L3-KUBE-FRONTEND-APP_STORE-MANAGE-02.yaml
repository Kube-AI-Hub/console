id: TC-L3-KUBE-FRONTEND-APP_STORE-MANAGE-02
level: 3
suite: point
module: kube-frontend
submodule: app-store
feature: manage
title: 应用商店管理 · 三个视图的显示列与刷新
entry_url: '{BASE_URL}/kube-frontend/apps-manage/store'
prd: prd/kube-frontend/app-store/manage.md
design: design/kube-frontend/app-store/manage.md

covers:
- AC-L3-KUBE-FRONTEND-APP_STORE-MANAGE-04

story:
- US1

product: 应用商店管理的应用/分类/审核三个视图各自提供「显示列」与刷新；取消勾选即时隐藏并按视图分别持久化，重置恢复。
preconditions:
- 已登录；商店有分类与应用数据
steps:
- 依次打开 apps-manage/store、/categories、/reviews
- 每个视图点「显示列」，取消勾选一个可隐藏列，核对表头减一
- 核对 localStorage 的 kube-frontend.columns.store-manage:<视图> 记录新集合
- 用菜单里的「重置」恢复全部列
expected:
- 三个视图都有 <视图键>:columns 触发器（store-manage:apps / :categories / :reviews）
- 取消勾选后表头数减一、选择已持久化
- 重置后表头恢复；三个视图互不影响
troubleshoot:
- 选择器不出现：schema 没有 refresh/search/filters，工具栏不渲染（列选择器在工具栏里）
- 三个视图互相影响：存储键没有按视图区分
update_automation:
- 句柄：store-manage:{apps,categories,reviews}:columns 与 :columns:<key>、:columns:reset；视图 surface 为 store-manage:<view>:surface
