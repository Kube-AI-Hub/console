title: 项目内自制 CRD 应用列表（聚合健康与组件）
entry_url: '{BASE_URL}/kube-frontend/{KA_WORKSPACE}/clusters/{KA_CLUSTER}/projects/{namespace}/applications/composing'
prd: prd/kube-frontend/app-store/crd-apps.md
design: design/kube-frontend/app-store/crd-apps.md

covers:
- AC-L3-KUBE-FRONTEND-APP_STORE-CRD_APPS-01
- AC-L3-KUBE-FRONTEND-APP_STORE-CRD_APPS-02

story:
- US1

product: 项目「自制应用」列表：读取 Application（app.k8s.io）集合，按 selector 聚合 Deployment/StatefulSet/Service/Ingress，显示名称、健康（含就绪比）、组件数、版本、创建时间；与 Helm 已安装应用分开。
preconditions:
- 已登录 admin；项目 namespace 可用；用例自建唯一 Application + 带 selector 标签的 Deployment，结束后删除两者
steps:
- 在 namespace 创建 Application（selector app.kubernetes.io/version=v1）与同标签 Deployment（replicas=1）
- 打开 /<ws>/clusters/<c>/projects/<ns>/applications/composing，等待列表就绪
- 断言行数为 1、名称为临时应用、组件工作负载数为 1、版本 v1、健康为健康
- 点击名称进入详情，断言行加载出该工作负载与就绪/期望、selector 与返回链接
- 从应用列表页点击「自制应用」入口，确认到达同一页面
expected:
- 列表来自 /kapis/resources…/namespaces/<ns>/applications，组件由 selector 匹配计算
- 健康由 matched workloads 的 readyReplicas 与 replicas 计算；无组件时未知
- 页面只读（无创建/删除入口），空集合显示空态
troubleshoot:
- 行数为 0：确认 Application 在 namespace 下且 selector 与 Deployment 标签一致
- 组件数为 0：检查 kapis resources 的 deployments 标签读取
update_automation:
- 句柄：composed-apps:surface/table/name:<name>/retry/back、installed-apps:composed-link
