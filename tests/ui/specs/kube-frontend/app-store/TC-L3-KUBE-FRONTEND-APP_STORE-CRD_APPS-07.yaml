title: 为自制应用添加 Ingress 路由
entry_url: '{BASE_URL}/kube-frontend/system-workspace/clusters/host/projects/default/applications/composing'
prd: prd/kube-frontend/app-store/crd-apps.md
design: design/kube-frontend/app-store/crd-apps.md

covers:
- AC-L3-KUBE-FRONTEND-APP_STORE-CRD_APPS-08

story:
- US2

product: 自制应用详情「添加路由」：选择该应用内的 Service 作为后端，填域名/路径，创建带 app 标签的 Ingress；dry-run 校验，失败回滚。
preconditions:
- 已登录 admin；项目 default 可用；用例自建 Application+Deployment+Service(80)，finally 清理三对象与 Ingress
steps:
- 打开详情，点「添加路由」，填域名、路径 /，保持默认后端服务与端口，提交
- 断言弹窗关闭、详情「路由」区块出现该 Ingress
- API 断言 Ingress 存在，labels app=<name>，rules host/路径/backend 指向该 Service:80
expected:
- 无 Service 时不显示添加路由入口；域名/路径/服务/端口本地校验
- Ingress 名称由 app/host/path 生成且合法；dry-run 先校验
- 创建失败删除已建 Ingress 并保留错误
troubleshoot:
- 详情无路由行：确认创建后 invalidate composed-app 查询
- Ingress backend 端口错误：确认服务端口映射
update_automation:
- 句柄：composed-app-detail:add-route；composed-app-route:dialog/host/path/service/port/submit/error
