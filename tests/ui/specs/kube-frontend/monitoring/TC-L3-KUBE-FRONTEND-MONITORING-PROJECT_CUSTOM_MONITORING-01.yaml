title: 项目自定义监控 · 仪表板列表与空态
entry_url: '{BASE_URL}/kube-frontend/system-workspace/clusters/host/projects/default/custom-monitoring'
prd: prd/kube-frontend/monitoring/custom-monitoring.md
design: design/kube-frontend/monitoring/custom-monitoring.md

covers:
- AC-L3-KUBE-FRONTEND-MONITORING-PROJECT_CUSTOM_MONITORING-01

story:
- US1

product: 项目作用域的自定义监控仪表板列表：名称、面板数、可编辑、创建时间；没有仪表板时显示明确空态。
preconditions:
- 已登录，且至少存在一个项目（带 kubesphere.io/workspace 标签的命名空间）
- host 集群的 monitoring.kubesphere.io/v1alpha2 dashboards 集合可读（可能为空）
steps:
- 用 API 读集群列表，取 host（或第一个集群）
- 用 API 读命名空间列表，取第一个带 kubesphere.io/workspace 标签的项目
- 读 /apis/monitoring.kubesphere.io/v1alpha2/namespaces/<ns>/dashboards 得到期望行数 N
- 打开该项目的 /custom-monitoring 页
- 等待 surface 离开 loading，读 data-ai-state
- 核对表头四列与行数；N 为 0 时核对空态块与文案
expected:
- surface 可见，data-ai-state 为 ready（有数据）或 empty（无数据）
- 有数据时表头含 名称 / 面板数 / 可编辑 / 创建时间，行数等于 N
- 无数据时 data-ai-id 为 project-custom-monitoring:empty 的块可见，文案含「还没有自定义监控仪表板」，且不渲染表头
troubleshoot:
- 整页错误：接口版本写成了 v1alpha3（本部署返回 404），应为 v1alpha2
- 行数恒为 0 但接口有对象：页面读的是 clusterdashboards 而不是 namespaced dashboards
- URL 404：路由目录 custom-monitoring 未建或 createFileRoute 路径少了 /projects/$namespace 段
update_automation:
- 选择器：project-custom-monitoring:surface / :table / :empty；页面 pages/monitoring/ProjectCustomMonitoringPage.tsx
