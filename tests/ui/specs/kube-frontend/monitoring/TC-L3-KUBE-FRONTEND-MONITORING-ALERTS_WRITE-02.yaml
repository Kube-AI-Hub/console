title: 告警策略 · SSAR 写权限门控（拒绝隐藏、允许显示、检查失败放行）
entry_url: '{BASE_URL}/kube-frontend/system-workspace/clusters/host/projects/default/alertingrules'
prd: prd/kube-frontend/monitoring/alerts-write.md
design: design/kube-frontend/monitoring/alerts-write.md

covers:
- AC-L3-KUBE-FRONTEND-MONITORING-ALERTS_WRITE-02

story:
- US2

product: 写入口与 SelfSubjectAccessReview 结论一致：无权限时不显示创建/编辑/删除/启停并说明原因；有权限时显示且现有写用例仍通过；权限检查本身失败时放行（fail-open）。
preconditions:
- 已登录
- 用唯一前缀测试对象创建一条项目级规则组，结束后删除
steps:
- 用 API 以 tc-e2e- 前缀创建 1 条规则的规则组
- 拦截 selfsubjectaccessreviews 返回 allowed=false，打开策略列表并打开行菜单
- 打开该策略详情，核对操作按钮
- 解除拦截，重载列表与详情，核对操作入口出现
- 让 selfsubjectaccessreviews 返回 500，重载列表，核对创建入口仍在（fail-open）
- finally 删除测试对象
expected:
- allowed=false：列表出现无创建权限说明且没有创建按钮；行菜单只有「详情」；详情没有编辑/删除/启停
- 允许时：创建按钮、行菜单编辑/删除/启停、详情编辑/删除/启停均出现
- 检查失败（500）时创建入口仍出现，不因权限检查故障禁用允许的操作
- 测试对象最终被删除，回读 404
troubleshoot:
- 拦截没生效：确认 route 匹配 **/selfsubjectaccessreviews，且请求是 POST
- 详情操作仍在：确认 canEdit/canDelete/canToggle 组合了 permissions
- 500 后入口消失：确认 hook 失败时返回 ALLOW_ALL，而不是 false
update_automation:
- 权限资源或动词变化时改 pages/monitoring/queries 与 permissions.ts
