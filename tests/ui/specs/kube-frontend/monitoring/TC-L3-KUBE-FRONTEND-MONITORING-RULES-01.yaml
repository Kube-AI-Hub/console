id: TC-L3-KUBE-FRONTEND-MONITORING-RULES-01
level: 3
suite: point
module: kube-frontend
submodule: monitoring
feature: rules
title: 告警策略 · 规则组列表与规则数一致
entry_url: '{BASE_URL}/kube-frontend/system-workspace/clusters/host/projects/default/alertingrules'
prd: prd/kube-frontend/monitoring/rules.md
design: design/kube-frontend/monitoring/rules.md

covers:
- AC-L3-KUBE-FRONTEND-MONITORING-RULES-01

story:
- US1

product: 告警策略页列出集群的规则组，列含名称（副行作用域）、策略状态、规则数、类型、创建时间，规则数与接口 spec.rules 长度一致。
preconditions:
- 已登录，且在 host 集群
- 集群的 alerting API 组提供 globalrulegroups 或 clusterrulegroups
steps:
- 探测 /apis/alerting.kubesphere.io/v2beta1 的资源清单，确认是规则组模型
- 用 API 读取 globalrulegroups 与 clusterrulegroups，记下条数与每个组的规则数
- 打开告警策略页，等待 surface 就绪
- 核对表头、行数、分页总数
- 逐行核对规则数与接口一致
expected:
- 页面状态为 ready，表头包含 名称、策略状态、规则数、类型、创建时间
- 分页显示的总数等于两个来源条数之和
- 每一行的规则数等于该组 spec.rules 长度
troubleshoot:
- 页面为空但接口有数据：确认告警策略页走了规则组分支（探测 API 组是否返回 globalrulegroups）
- 规则数为 0 但接口有规则：确认读的是 spec.rules 而不是 spec.groups
- 总数不一致：检查是否漏掉 clusterrulegroups
update_automation:
- 接口或列变化时改 pages/monitoring.py 与 api-client 的 alerting.ts
