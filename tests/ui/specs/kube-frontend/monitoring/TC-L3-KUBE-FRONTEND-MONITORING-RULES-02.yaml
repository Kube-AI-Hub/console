title: 告警策略 · 启用停用只改标签
entry_url: '{BASE_URL}/kube-frontend/system-workspace/clusters/host/projects/default/alertingrules'
prd: prd/kube-frontend/monitoring/rules.md
design: design/kube-frontend/monitoring/rules.md

covers:
- AC-L3-KUBE-FRONTEND-MONITORING-RULES-02

story:
- US3

product: 点「停用」只把 alerting.kubesphere.io/enable 标签改成 false，规则体不变；再点「启用」还原。
preconditions:
- 集群里有可写的规则组（globalrulegroups）
- 用例开始前记录该组原标签与 spec，结束时无条件还原
steps:
- 用 API 读取一个规则组，记录原 enable 标签与 spec.rules 的长度与首条规则名
- 打开告警策略页，搜索该组，打开行菜单点「停用」
- 用 API 回读标签与 spec
- 再点「启用」，再次回读
expected:
- 停用后标签为 false，spec.rules 长度与首条规则名不变
- 启用后标签还原为原值
- 列表状态徽章随之变化
troubleshoot:
- 标签没变：确认写的是 label 而不是 annotation
- spec 被改：说明用了 PUT 整对象而不是 merge patch
- 找不到「停用」菜单项：确认该行当前是启用状态（两个互斥菜单项）
update_automation:
- 开关实现变化时改 api-client 的 alerting.ts
