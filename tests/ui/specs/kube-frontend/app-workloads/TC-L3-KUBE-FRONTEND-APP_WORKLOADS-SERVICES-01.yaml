story:
- US1

product: 服务列表显示端口；「编辑服务」可改端口并保留端口名；ExternalName 服务不提供该操作。
preconditions:
- 由夹具创建一个 ClusterIP 类型、端口 80→8080 的 tc-e2e- 服务，用例结束无条件删除
- 另建一个 ExternalName 服务用于核对入口是否隐藏
- 已登录，且在 host 集群的 default 项目空间
steps:
- 打开服务列表，读取该行的端口列
- 打开行操作，读取条目
- 点「编辑服务」，把端口改为 8080 并确认
- 用 API 核对 spec.ports
- 对 ExternalName 服务打开行操作
expected:
- 端口列显示 80→8080
- 行操作含「编辑服务」
- 修改后 spec.ports 只剩一个端口且 port 为 8080，端口名仍为 http
- ExternalName 服务的行操作不含「编辑服务」
troubleshoot:
- 端口没变时确认发送的是完整端口列表（merge patch 对数组是整体替换）
- 端口名丢失说明提交时没有沿用原有名称
update_automation:
- 服务字段变化时改 api-client 的 servicePortsOf
