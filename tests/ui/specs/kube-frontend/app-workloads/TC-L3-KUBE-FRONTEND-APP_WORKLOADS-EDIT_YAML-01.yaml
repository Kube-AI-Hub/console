suite: point
module: kube-frontend
submodule: app-workloads
feature: edit-yaml
title: 编辑 YAML · 预填对象并原样保存
entry_url: "{BASE_URL}/kube-frontend/system-workspace/clusters/host/projects/default/deployments"
prd: prd/kube-frontend/app-workloads/edit-yaml.md
design: design/kube-frontend/app-workloads/edit-yaml.md

covers:
- AC-L3-KUBE-FRONTEND-APP_WORKLOADS-EDIT_YAML-01

story:
- US1

product: 详情页的「编辑 YAML」打开预填当前对象的编辑器，名称锁定；原样保存后对话框关闭。
preconditions:
- 由用例的 fixture 创建一个 tc-e2e- 前缀的部署，用例结束后无条件删除
- 已登录，且在 host 集群的 default 项目空间
steps:
- 打开该部署的详情
- 点击「编辑 YAML」
- 读取编辑器内容
- 不做修改直接保存
expected:
- 编辑器预填对象 YAML，包含 metadata.name 与 namespace
- 保存按钮可用，点击后对话框关闭
- 对象仍以原名称存在，未被重命名或清空
troubleshoot:
- 编辑器为空时先看详情对象是否已加载
- 保存失败时看 PUT 是否打到 /apis/apps/v1 且带 resourceVersion
update_automation:
- 文案变化时改 packages/locales/src/index.ts
- 编辑器结构变化时改 pages/app_workloads.py
