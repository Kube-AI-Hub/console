entry_url: '{BASE_URL}/kube-frontend/system-workspace/clusters/host/projects/default/s2ibuilder'
prd: prd/kube-frontend/app-workloads/s2ibuilder.md
design: design/kube-frontend/app-workloads/s2ibuilder.md

covers:
- AC-L3-KUBE-FRONTEND-APP_WORKLOADS-S2IBUILDER-03

story:
- US2

product: 创建向导分两步：构建模式/语言，构建设置；源码构建填仓库 URL/分支/密钥/镜像名/标签/目标镜像服务与高级项；提交创建 S2iBuilder（带 pull policy、s2i-type、languageType、repoUrl 前缀）并创建一个 S2iRun。
preconditions:
- 已登录，且在 host 集群的 default 项目
- 存在构建模板（5 个）
- 存在 dockerconfigjson 保密字典
steps:
- API 创建一个唯一前缀的 dockerconfigjson 保密字典（registry.example.com）
- 打开列表，点击创建构建器，选择「通过代码构建镜像 / Java」，进入下一步
- 等待构建环境预选；填写仓库 URL、分支、镜像名称、标签，选择目标镜像服务
- 展开高级设置，添加一个环境变量并填值；提交
- 等待对话框关闭；用 API 读取该构建器与 s2irun，核对字段与列表行
expected:
- 步骤 1 选择构建模式与语言后才能进入步骤 2；模板来自 s2ibuildertemplates
- 创建请求 POST /apis/devops.kubesphere.io/v1alpha1/namespaces/default/s2ibuilders 返回 201
- 对象标签 s2i-type.kubesphere.io=s2i、注解 languageType=java，config 含 builderPullPolicy/sourceUrl/revisionId/imageName（带 registry.example.com 前缀）/tag/environment
- 创建后存在一条 spec.builderName 等于新构建器名的 S2iRun；列表出现该行
- 必填/格式错误时显示字段错误且不提交
troubleshoot:
- 提交按钮禁用：模板或目标镜像服务为空
- 创建 403：webhook 校验 builderPullPolicy/sourceUrl
- 没有运行记录：创建后是否 createRun
update_automation:
- 页面句柄或字段映射变化时同步本用例
