story:
- US4

product: 构建记录页签展示最后构建环境与运行记录（序号/状态/镜像/开始时间/最后消息/日志）；运行状态来自 status.runState；无 logURL 时说明控制器未创建构建任务，有 logURL 时读取日志并在构建中每 4 秒刷新。
preconditions:
- 已登录，且在 host 集群的 default 项目
- 存在一个测试构建器与一条运行
steps:
- API 创建构建器与一条 S2iRun；打开详情，构建记录为默认页签
- 核对运行记录行：序号 #1、状态「状态未知」、最后消息说明控制器未写入状态
- 点击查看日志，断言显示「运行尚未产生日志地址」提示（无 logURL）
- 用 /status 子资源写入成功状态与构建结果（模拟控制器汇报），刷新后核对状态徽章、最后消息、最后构建环境与镜像信息
expected:
- 运行记录行数与 spec.builderName 匹配的运行数一致，序号由新到旧
- 未汇报状态显示「状态未知」，不把空状态展示成成功/失败
- 无 logURL 时不发日志请求，显示如实提示
- 模拟 status 后：状态=构建成功、最后消息=镜像：<name>/成功、最后构建环境显示 builderImage/sourceUrl/revisionId
troubleshoot:
- 行不出现：spec.builderName 过滤是否生效
- 状态一直是未知：status 子资源是否被读取
- 日志请求 404：logURL 是否为空仍发请求
update_automation:
- 页面句柄或字段映射变化时同步本用例
