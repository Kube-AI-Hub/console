product: 独立近全屏日志弹窗展示最近 1 小时历史日志，可按关键字查询并保留格式。
preconditions:
- 已登录
- 集群日志组件在采集（ES 索引有数据），且有正在输出的容器
steps:
- 用 API 找一个「容器组存在且有日志」的对象
- 打开该容器组该容器的详情页
- 点「打开日志控制台」，核对弹窗内真实日志内容非空
- 提交唯一无匹配关键字，核对空态；清空并重新查询后恢复内容
expected:
- 日志弹窗存在并显示时间与内容，不将 ANSI 控制码显示为普通文本
troubleshoot:
- 区块缺失：页面仍是旧包（改完要 vite build）
- 空态但接口有数据：过滤键用了单数（pod/container），应为 pods/containers
- 时间参数毫秒：接口要秒
update_automation:
- 选择器见 pages/app_workloads.py 与 ContainerDetailPage.tsx
