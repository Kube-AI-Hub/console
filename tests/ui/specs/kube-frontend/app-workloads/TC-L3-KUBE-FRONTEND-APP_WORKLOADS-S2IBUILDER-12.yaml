story:
- US5

product: 列表的五种画面分开：加载中、真实空、无匹配、失败、无权限；403 显示权限原因且不提供重试；英文界面文案完整；三档宽度下表头与行内容可读。
preconditions:
- 已登录
- 可在浏览器路由层拦截列表响应（模拟）
steps:
- 拦截 kapis 列表返回空 items → 打开列表，断言 empty 状态与空态文案
- 拦截列表返回 500 → 断言 error 状态、错误面板与重试按钮
- 拦截列表返回 403 → 断言无权限文案且没有重试按钮
- 以 localStorage kube-frontend-locale=en 打开列表，断言英文表头
expected:
- 空态/失败/无权限是三种不同画面，不互相顶替
- 500 提供重试；403 不提供重试并说明没有权限
- 英文界面显示 Name/Status 等英文表头，不出现原始 key
- surface 始终声明 data-ai-state（loading/ready/empty/error 之一）
troubleshoot:
- 拦截未命中：路由 glob 与 kapis 路径
- 403 仍显示重试：retry 分支条件
- 英文缺键：zh/en 键集合是否一致
update_automation:
- 页面句柄或字段映射变化时同步本用例
