- AC-L3-KUBE-FRONTEND-APP_WORKLOADS-S2IBUILDER-05

story:
- US3

product: 详情页展示名称/项目/类型/构建器镜像/镜像名称/拉取策略/代码仓库/远程触发器/创建时间/创建者；操作有条目顺序 运行/编辑信息/编辑 YAML/删除；五个页签可切换；不存在的对象显示「资源不存在」并可返回列表。
preconditions:
- 已登录，且在 host 集群的 default 项目
- 存在一个唯一前缀的测试构建器
steps:
- API 创建构建器并 patch 别名/描述；打开其详情页
- 核对标题、状态徽章、类型徽章与属性区字段值
- 逐个点击构建记录/资源状态/镜像制品/环境变量/事件页签，核对面板出现与各自空态
- 点击编辑 YAML，断言对话框打开且取消可关闭
- 打开一个不存在的对象名，断言 404 面板与返回列表链接
expected:
- 属性含 构建器镜像、镜像名称、拉取策略、代码仓库、远程触发器、创建时间等；远程触发器包含 s2itrigger 与对象名
- 操作顺序为 运行、编辑信息、编辑 YAML、删除
- 五个页签均存在且可切换；无 Job 时资源状态/环境变量/事件显示如实的「未创建构建任务」提示，镜像制品显示空态
- 编辑 YAML 对话框可打开；取消不改对象
- 不存在对象显示「资源不存在」与返回列表链接，不显示空白页
troubleshoot:
- 详情 404：CRD 名称/命名空间是否正确
- 页签空白：面板是否渲染了空态
- 触发器不对：s2ioperator 服务地址与 secretCode 查询参数
update_automation:
- 页面句柄或字段映射变化时同步本用例
