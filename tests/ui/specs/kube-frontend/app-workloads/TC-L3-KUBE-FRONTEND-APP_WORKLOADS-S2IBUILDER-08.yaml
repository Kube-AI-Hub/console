- AC-L3-KUBE-FRONTEND-APP_WORKLOADS-S2IBUILDER-08

story:
- US4

product: 资源状态页签读取最近一次运行的 Job：展示容器端口与 Job 的 Pod；控制器未创建 Job 时显示「未创建构建任务」提示，不渲染空表冒充成功。
preconditions:
- 已登录，且在 host 集群的 default 项目
- 存在一个测试构建器与一条无 Job 的运行
steps:
- 创建构建器与运行（当前控制器不产生 Job）；打开详情
- 点击资源状态页签
- 断言显示 noJob 提示，且容器端口/容器组表格不存在
expected:
- 最近一次运行没有 kubernetesJobName 时不请求 Job（或 404 视为未创建），显示如实提示
- 不渲染端口/容器组空表，避免读者误以为构建没有资源
troubleshoot:
- 接口 500：Job 路径与命名空间
- 误报空态：控制器已创建 Job 时是否读取 status.kubernetesJobName
update_automation:
- 页面句柄或字段映射变化时同步本用例
