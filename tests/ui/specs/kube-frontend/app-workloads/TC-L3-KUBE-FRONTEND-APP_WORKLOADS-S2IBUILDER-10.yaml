story:
- US4

product: 环境变量页签读取最近一次运行 Job 的容器 env（含 valueFrom secret/configmap 的值），按容器分组，首个展开；名称含 password/secret 的值以 ****** 显示；无 Job 时如实空态。
preconditions:
- 已登录，且在 host 集群的 default 项目
- 存在一个测试构建器与一条无 Job 的运行
steps:
- 创建构建器与运行；打开详情，点击环境变量页签
- 断言显示「未创建构建任务」提示且不渲染容器表
expected:
- 无 Job 时不读取容器 env，页面显示如实提示
- 有 Job 时按容器分组、valueFrom 解析后展示；敏感名称值打码
troubleshoot:
- 读取失败：Job 是否取最近运行
- 值泄露：password/secret 名称是否打码
update_automation:
- 页面句柄或字段映射变化时同步本用例
