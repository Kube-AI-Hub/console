title: 编辑设置 · 改镜像、增删环境变量并在提交前看到变更
entry_url: "{BASE_URL}/kube-frontend/system-workspace/clusters/host/projects/default/deployments"
prd: prd/kube-frontend/app-workloads/edit-form.md
design: design/kube-frontend/app-workloads/edit-form.md

covers:
- AC-L3-KUBE-FRONTEND-APP_WORKLOADS-EDIT_FORM-01

story:
- US1
- US2

product: 部署详情的「编辑设置」按容器列出镜像与环境变量；把镜像改成唯一 tag、新增一个环境变量后保存，回读对象的 Pod 模板与填写一致；弹窗在提交前列出将改字段，其余字段保持不变，最后还原。
preconditions:
- 由用例的 fixture 创建一个 tc-e2e- 前缀的部署，用例结束后无条件删除
- 已登录，且在 host 集群的 default 项目空间
steps:
- 打开该部署的详情，点「编辑设置」
- 把镜像改成带唯一后缀的 tag，读取「将要修改的字段」，保存
- 回读该部署的 spec 确认镜像、副本数与容器名
- 重新打开弹窗，新增一个环境变量，保存并回读 env
- 重新打开弹窗，把镜像改回原值、删除该环境变量，保存并回读
expected:
- 弹窗出现镜像、拉取策略、环境变量与副本数控件
- 变更列表出现 spec.template.spec.containers.main.image 与新的 tag
- 保存后回读 spec.template.spec.containers[0].image 与新 tag 一致，spec.replicas 仍为 1，容器名未变
- 保存后回读 env 出现新增项（名称与值一致），镜像仍是上一步的 tag
- 还原后镜像回到原值、env 中不再有该变量
troubleshoot:
- 弹窗没有出现时先确认详情页已加载且部署种类为 deployments
- 保存失败时看 PUT 是否打到 /apis/apps/v1 且带 resourceVersion
- 找不到环境变量输入行时用 data-ai-id 前缀 deployments-edit:env-key 匹配
update_automation:
- 文案变化时改 packages/locales/src/index.ts 的 workloads.editSettings.*
- 弹窗结构变化时改 pages/app_workloads.py 的编辑设置辅助方法
