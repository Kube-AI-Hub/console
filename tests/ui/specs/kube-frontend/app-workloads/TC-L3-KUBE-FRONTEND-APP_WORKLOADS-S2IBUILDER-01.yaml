- AC-L3-KUBE-FRONTEND-APP_WORKLOADS-S2IBUILDER-01

story:
- US1

product: 项目级镜像构建器列表通过 kapis 资源代理读取，服务端分页、名称搜索与 totalItems；表格展示名称/类型/服务/构建镜像/状态/最近构建/创建时间；刷新保留搜索；空态说明来源；错误态可重试。
preconditions:
- 已登录，且在 host 集群的 default 项目
- devops 模块已安装，s2ibuilders CRD 可读
steps:
- 用 API 创建两个唯一前缀的镜像构建器（带 displayName 与 serviceName 注解）
- 打开 /kube-frontend/system-workspace/clusters/host/projects/default/s2ibuilder
- 等待 surface 离开 loading，核对表头含 名称/状态/创建时间
- 按唯一前缀搜索，断言只剩目标行；核对请求走了 kapis 资源代理且带 page/limit 参数
- 清空搜索并点击刷新，断言状态回到 ready
expected:
- 列表请求命中 kapis/resources.kubesphere.io/v1alpha3/namespaces/default/s2ibuilders 且带 page、limit 参数
- 表头包含 名称/状态/创建时间，行内展示 displayName 与构建镜像
- 搜索后只显示匹配行；刷新不会清空搜索值并重新读取
- 无构建器时显示「暂无镜像构建器」空态并说明来源
troubleshoot:
- 列表为空：API 是否 0 条
- 请求 404：是否读了 v1alpha3 之外的路径
- 行数不符：分页 totalItems 与 page 参数
update_automation:
- 页面句柄或字段映射变化时同步本用例
