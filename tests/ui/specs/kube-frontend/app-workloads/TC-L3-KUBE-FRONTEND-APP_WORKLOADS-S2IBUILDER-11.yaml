- AC-L3-KUBE-FRONTEND-APP_WORKLOADS-S2IBUILDER-11

story:
- US4

product: 事件页签按 involvedObject.kind=Job/name/namespace 读取事件，展示类型/原因/最近发生/次数/来源/消息；无 Job 或事件为空时显示如实空态。
preconditions:
- 已登录，且在 host 集群的 default 项目
- 存在一个测试构建器与一条无 Job 的运行
steps:
- 创建构建器与运行；打开详情，点击事件页签
- 断言显示「未创建构建任务」提示，无事件表
expected:
- 无 Job 时不请求事件或显示如实提示
- 有事件时表格列与事件字段一致，Warning 类型有区分色
troubleshoot:
- 事件请求参数错误：fieldSelector 的 involvedObject 字段
- 空态误判：Job 存在但无事件
update_automation:
- 页面句柄或字段映射变化时同步本用例
