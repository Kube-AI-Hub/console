- US2

product: 创建向导采集名称、目标 Deployment、类型与初始流量；点下一步只做本地校验并展示确认摘要（含初始流量），点确认后才 POST Strategy。Canary 按 100-w/w 写两条权重与 governor；Bluegreen 写 100/0 且 governor 为参考版本；Mirror 写参考版本 100% 加 mirror 到新版本。成功后关闭弹窗、列表出现该行；finally 删除并核对计数回创建前。
preconditions:
- 已登录，host 集群 default 项目，servicemesh 已启用
- 项目内至少一个 Deployment；strategies 集合可读可写
- 用例对象使用 tc-e2e-gray-create- 前缀，finally 无条件删除
steps:
- 用 API 读取 default 项目的 Deployment 列表与 strategies 当前条数
- 打开灰度发布页，点「创建灰度发布」
- 填唯一名称、选择第一个 Deployment、类型 Canary、初始流量 25，点「下一步」
- 此时用 API 回读该名称应为 404，且页面尚未发出 POST
- 点「确认创建」，轮询 API 直到对象出现，核对类型/选择器/host/权重 75/25/governor 为空
- 再次创建 Bluegreen 与 Mirror，核对权重 100/0 与 mirror 字段、governor 为参考版本
- 核对页面成功提示与列表行；finally 删除三个对象并核对计数回创建前
expected:
- 点「下一步」不产生写请求；对象在确认前不存在
- Canary 对象两条路由权重为 75/25 且 spec.governor 为空
- Bluegreen 对象权重为 100/0 且 spec.governor 等于参考版本
- Mirror 对象第一条路由为参考版本 100% 且存在 mirror 目标
- 列表出现对应的行；删除后回读 404、计数回创建前、无本前缀残留
troubleshoot:
- 创建按钮不可见：列表是否处于 error/loading，或权限检查明确拒绝
- 确认后 409：名称已被占用（换唯一后缀）
- 权重不是 75/25：检查向导是否把初始流量写进 manifest
- 计数未回零：finally 的 DELETE 是否执行/对象名是否一致
update_automation:
- 向导句柄与初始流量字段变化时同步本用例
