submodule: app-workloads
feature: list-standard
title: 列表交互标准 · 首屏骨架与刷新遮罩不混用
entry_url: "{BASE_URL}/kube-frontend/clusters/host/deployments"
prd: prd/kube-frontend/app-workloads/list-standard.md
design: design/kube-frontend/app-workloads/list-standard.md

covers:
- AC-L3-KUBE-FRONTEND-APP_WORKLOADS-LIST_STANDARD-05
- AC-L3-KUBE-FRONTEND-APP_WORKLOADS-LIST_STANDARD-06

story:
- US1

product: 列表首屏是骨架行、重取是保留行的「更新中…」遮罩；图表首屏是与图表等高的骨架，手动刷新保留曲线，自动刷新不出现遮罩。
preconditions:
- 已登录，host 集群
- 该集群至少有一个项目与一条部署（列表可加载出数据）
steps:
- 对列表与图表的接口加网络延迟（如 800ms），重新打开集群级部署列表
- 在数据到达前读取 surface 的 data-ai-state 与骨架行数量
- 数据到达后读取行数；点刷新，读取遮罩、aria-busy 与行数
- 打开集群概览，读取图表首屏：骨架句柄、骨架与图表容器的 getBoundingClientRect 高度、是否同时存在绘图区
- 数据到达后读图表容器高度；点面板刷新读取遮罩句柄与曲线是否仍在
- 若有自动刷新开关，开启后等两个刷新周期，确认遮罩未出现
expected:
- 首屏 surface 的 data-ai-state 为 loading，出现骨架行，不出现「更新中…」遮罩
- 数据到达后 data-ai-state 为 ready，行数大于 0
- 点刷新时出现 table:refreshing，容器 aria-busy=true，行数等于刷新前
- 图表首屏只有骨架（<chartAiId>:loading），绘图区不渲染
- 骨架与就绪状态的图表容器高度相等（差值 ≤ 1px）
- 面板刷新时出现 <chartAiId>:refreshing，曲线仍在屏幕上（不换成骨架）
- 自动刷新期间不出现遮罩
troubleshoot:
- 首屏出现遮罩或骨架与遮罩同时出现：页面把 loading 与 refreshing 一起传了
- 首屏面板高度明显大于就绪态：骨架叠在图表上方，而不是代替它
- 手动刷新无遮罩：manualRefresh 没有接线，或页面用 isFetching 推断而钩子只认读者点击
- 自动刷新也闪遮罩：manualRefresh 接到了 query.isFetching
update_automation:
- 列表：data-ai-state="loading" → 骨架行；重取句柄 table:refreshing
- 图表：骨架 <aiId>:loading，遮罩 <aiId>:refreshing；以 panel 容器高度作为占位高度的判据
