- AC-L3-KUBE-FRONTEND-STORAGE-DELETE-01

story:
- US1

product: 行操作「删除」要求输入对象名确认，提交后行从列表消失且 API 返回 404。
preconditions:
- 由用例的 fixture 创建一个 tc-e2e- 前缀的 PVC，用例结束后无条件删除（已删除时容忍 404）
- 只删除用例自己创建的 tc-e2e- 对象，不碰项目里已有的 PVC
- 已登录，且在 host 集群的 default 项目空间
steps:
- 打开存储卷列表并定位目标行
- 打开目标行的更多操作并选择「删除」
- 确认按钮在名称不完整时保持禁用
- 输入完整对象名并提交
expected:
- 对话框出现时确认按钮禁用
- 输入完整名称后确认按钮可用
- 提交后对话框关闭，目标行从列表消失
- 用 API 读取该 PVC 返回 404
troubleshoot:
- 行不消失时看删除成功后是否 invalidateQueries 重新拉取
- 删除 404 但行仍在时看列表是否命中旧缓存
- 确认按钮一直禁用时看输入框是否绑定了 delete-input 句柄
update_automation:
- 文案变化时改 packages/locales/src/index.ts
- 确认框结构变化时改 pages/storage.py
