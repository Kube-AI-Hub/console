preconditions:
- 已登录，且在 host 集群的 default 项目空间
- fixture 提供一个已登录的浏览器上下文

steps:
- 打开存储卷页
- 切到存储卷快照页签
- 再切回存储卷
- 统计切换期间的文档请求

expected:
- 两个页面各自出现列表或空态
- 每次切换后对应页签高亮
- 切换期间文档请求为 0
- 工作区栏显示的项目始终是 default

troubleshoot:
- 出现文档请求说明页签退化成整页跳转，检查 AreaTabs 的 <a> 是否被 onNavigate 接管

