title: 编辑 YAML · 先加载框再预填对象，取消不变
entry_url: "{BASE_URL}/kube-frontend/system-workspace/clusters/host/projects/default/persistentvolumeclaims"
prd: prd/kube-frontend/storage/edit-yaml.md
design: design/kube-frontend/storage/edit-yaml.md

covers:
- AC-L3-KUBE-FRONTEND-STORAGE-EDIT_YAML-01

story:
- US1

product: 行操作「编辑 YAML」先打开加载对话框，取到完整对象后换成预填该对象的编辑器；取消后对象不变。
preconditions:
- 由用例的 fixture 创建一个 tc-e2e- 前缀的 PVC，用例结束后无条件删除
- 已登录，且在 host 集群的 default 项目空间
steps:
- 打开存储卷列表并定位目标行
- 记录打开前该 PVC 的 resourceVersion
- 打开行操作菜单，点「编辑 YAML」
- 观察加载对话框与编辑器的先后
- 读取编辑器内容中的 metadata.name 与 namespace
- 点取消，再读取该 PVC
expected:
- 点「编辑 YAML」后先出现 [data-ai-id="dialog:loading"]，随后才出现编辑器
- 编辑器预填对象 YAML，包含 metadata.name=<name> 与 namespace=default
- 取消后对话框关闭
- PVC 仍存在，resourceVersion 与打开前一致（没有写回）
troubleshoot:
- 编辑器为空时先看详情请求是否已返回；加载框一直不消失说明请求失败
- 加载框没出现时看 onAction 是否在取详情前 setDialog({kind:'loading'})
- 取消后对象被改时看 YamlDialog 是否在未提交时也调用了 update
update_automation:
- 文案变化时改 packages/locales/src/index.ts
- 编辑器结构变化时改 pages/storage.py
