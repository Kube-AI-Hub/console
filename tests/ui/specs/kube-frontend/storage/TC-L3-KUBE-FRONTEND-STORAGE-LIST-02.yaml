id: TC-L3-KUBE-FRONTEND-STORAGE-LIST-02
level: 3
suite: point
module: kube-frontend
submodule: storage
feature: list
title: 存储卷列表 · 空态标题与说明且无表头
entry_url: "{BASE_URL}/kube-frontend/system-workspace/clusters/host/projects/default/persistentvolumeclaims"
prd: prd/kube-frontend/storage/list.md
design: design/kube-frontend/storage/list.md

covers:
- AC-L3-KUBE-FRONTEND-STORAGE-LIST-02

story:
- US1

product: 项目内没有存储卷时，列表显示空态标题与说明，且不渲染表头。
preconditions:
- 目标项目没有 PVC；用例依次用 API 读取 kube-frontend-demo、kube-public、default 的 totalItems，取第一个为 0 的项目；三个都非空时跳过而不是伪造空态
- 已登录，且在 host 集群（default 是共享项目，可能被其它套件临时占用）
steps:
- 用 API 读取该项目的 PVC 总数
- 打开存储卷列表
- 读取主区的 data-ai-state 与文本
- 统计主区内的 thead 数量
expected:
- API 返回 totalItems=0
- 主区 data-ai-state="empty"
- 文本包含「暂无存储卷」与「创建存储卷后，这里会列出它们。」
- 主区内 thead 数量为 0
troubleshoot:
- 空态却仍有表头时看共享 Table 是否按 rows.length 分支渲染
- data-ai-state 不是 empty 时先看请求是否 403 或落到了错误态
- 项目里出现残留 tc-e2e- PVC 时先跑一次清理，再复跑
update_automation:
- 文案变化时改 packages/locales/src/index.ts
- 句柄变化时改 pages/storage.py
