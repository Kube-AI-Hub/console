id: TC-L3-KUBE-FRONTEND-STORAGE-EXPAND-01
level: 3
suite: point
module: kube-frontend
submodule: storage
feature: expand
title: 存储卷 · 扩容与按存储类门控
entry_url: '{BASE_URL}/kube-frontend/system-workspace/clusters/host/projects/default/persistentvolumeclaims'
prd: prd/kube-frontend/storage/list.md
design: design/kube-frontend/storage/list.md

covers:
- AC-L3-KUBE-FRONTEND-STORAGE-LIST-04

story:
- US1

product: 只有存储类允许扩容的存储卷才出现「扩容」；填小值被拦下，填大值写入 spec.resources.requests.storage。
preconditions:
- 由夹具创建一个使用可扩容存储类的 tc-e2e- 存储卷，用例结束无条件删除
- 另外创建一个使用不可扩容存储类的存储卷，用于核对入口是否隐藏
- 已登录，且在 host 集群的 default 项目空间
steps:
- 打开列表，对不可扩容那个卷打开行操作，读取条目
- 对可扩容的卷打开行操作，读取条目
- 点「扩容」，先填小于当前容量的值并确认
- 再填更大的值并确认
- 用 API 核对 spec.resources.requests.storage
expected:
- 不可扩容的卷不出现「扩容」
- 可扩容的卷出现「扩容」
- 小于当前容量时提交被拦下并给出提示
- 更大的值写入成功
troubleshoot:
- 入口恒显示或恒隐藏时看 useExpandableClasses 的映射
- 写入失败时确认存储类设置了 allowVolumeExpansion
update_automation:
- 存储类特性变化时改 api-client 的 storageClassExpands
