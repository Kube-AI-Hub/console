preconditions:
- 由夹具创建一个 tc-e2e- 前缀的存储卷，用例结束无条件删除
- 已登录，且在 host 集群的 default 项目空间

steps:
- 从列表点击名称进入详情
- 读取属性名序列
- 核对集群与项目两行的值

expected:
- 属性名依次为 集群、项目、存储类型、容量、访问模式、持久卷、创建时间、创建者
- 集群为 host，项目为 default

