id: TC-L3-KUBE-FRONTEND-STORAGE-DETAIL-01
level: 3
suite: point
module: kube-frontend
submodule: storage
feature: detail
title: 存储卷详情 · 八项属性顺序与取值
entry_url: "{BASE_URL}/kube-frontend/system-workspace/clusters/host/projects/default/persistentvolumeclaims"
prd: prd/kube-frontend/storage/detail.md
design: design/kube-frontend/storage/detail.md

covers:
- AC-L3-KUBE-FRONTEND-STORAGE-DETAIL-01

story:
- US1

product: 点击列表名称进入 PVC 详情，属性块按固定顺序展示集群、项目、存储类型、容量、访问模式、持久卷、创建时间与创建者。
preconditions:
- 由用例的 fixture 创建一个 tc-e2e- 前缀、1Gi、ReadWriteOnce 的 PVC，用例结束后无条件删除
- 已登录，且在 host 集群的 default 项目空间
steps:
- 打开存储卷列表并点击目标 PVC 的名称
- 等待详情主区就绪
- 读取属性标签的顺序
- 读取集群、项目、存储类型、容量与访问模式的值
expected:
- URL 以 /persistentvolumeclaims/<name> 结尾
- 八个属性标签按此顺序出现：集群、项目、存储类型、容量、访问模式、持久卷、创建时间、创建者（详情另有 状态、供应者，由 DETAIL-02 覆盖）
- 集群为 host，项目为 default，容量为 1Gi，访问模式为 RWO
- 存储类型等于创建时使用的 StorageClass；未绑定的卷持久卷与创建者显示 -
troubleshoot:
- 详情显示成列表时先看路由文件夹是否同时提供 index 与 $name 路由
- 属性缺项时看 StorageDetailPage 的 Row 是否仍渲染
- 标签顺序变化时改 pages/storage.py 的断言顺序
update_automation:
- 文案变化时改 packages/locales/src/index.ts
- 属性顺序变化时改 pages/storage.py
