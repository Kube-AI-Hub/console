id: TC-L2-KUBE-FRONTEND-LOGIN-02
level: 2
suite: login
module: kube-frontend
submodule: login
feature: session
title: 新前端 · 登录失败提示可区分
entry_url: "{BASE_URL}/login"
prd: prd/kube-frontend/login.md
design: design/kube-frontend/login.md

covers:
- AC-L2-KUBE-FRONTEND-LOGIN-02
- AC-L2-KUBE-FRONTEND-LOGIN-03

story:
- US2

product: 登录失败时用户能看出是哪一类问题，而不是笼统的「登录失败」。
preconditions:
- 浏览器 localStorage 中没有 kubesphere-token
steps:
- 打开 /login，不填任何内容直接提交
- 只填用户名，提交
- 填入存在的用户名与错误密码，提交
- 观察提示与输入框
expected:
- 空提交时用户名与密码下方各出现一条提示，且不发生网络请求
- 只填用户名时只有密码下方出现提示
- 错误密码时表单内显示「用户名或密码不正确」
- 错误密码后密码框被清空，用户名保留，localStorage 中没有 token
troubleshoot:
- 显示「登录失败」而没有任何细分提示时，检查 BFF 返回的 code 是否被 ApiError 折叠
- 提示为「无法连接集群」时先确认 ks-apiserver 可达
update_automation:
- 文案变更时同步 locales 与断言
