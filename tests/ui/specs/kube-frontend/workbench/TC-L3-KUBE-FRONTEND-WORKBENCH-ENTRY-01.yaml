id: TC-L3-KUBE-FRONTEND-WORKBENCH-ENTRY-01
level: 3
suite: point
module: kube-frontend
submodule: workbench
feature: entry
title: 工作台 · 企业空间与项目入口
entry_url: '{BASE_URL}/kube-frontend/'
prd: prd/kube-frontend/workbench/entry.md
design: design/kube-frontend/workbench/entry.md

covers:
- AC-L3-KUBE-FRONTEND-WORKBENCH-ENTRY-01
- AC-L3-KUBE-FRONTEND-WORKBENCH-ENTRY-02

story:
- US1

product: 顶部「工作台」到达 /kube-frontend/；页面按企业空间列出项目；点项目进入该项目控制台。
preconditions:
- 已登录
steps:
- 从集群列表点击顶部「工作台」
- 核对地址与页面内容（企业空间、项目）
- 点击第一个项目
expected:
- 地址为 /kube-frontend/
- 至少一个企业空间分组与一个项目胶囊
- 点击后进入该项目控制台（地址含集群与命名空间）
troubleshoot:
- 点击后 Not Found：/kube-frontend/ 缺路由（历史上顶部入口就指向这里）
- 分组为空但项目存在：项目按集群异步加载，需等待分组出现
update_automation:
- 选择器变化时改 pages/workbench.py
