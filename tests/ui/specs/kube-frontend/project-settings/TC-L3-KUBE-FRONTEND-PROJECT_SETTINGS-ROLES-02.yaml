id: TC-L3-KUBE-FRONTEND-PROJECT_SETTINGS-ROLES-02
level: 3
suite: point
module: kube-frontend
submodule: project-settings
feature: roles
title: 项目角色 · 编辑信息与删除
entry_url: '{BASE_URL}/kube-frontend/system-workspace/clusters/host/projects/default/roles'
prd: prd/kube-frontend/project-settings/roles.md
design: design/kube-frontend/project-settings/roles.md

covers:
- AC-L3-KUBE-FRONTEND-PROJECT_SETTINGS-ROLES-02

story:
- US1

product: 非模板角色的行操作提供「编辑信息」与「删除」；编辑写别名注解，删除后对象不存在。
preconditions:
- 由夹具通过原生 RBAC 创建一个 tc-e2e- 项目角色，用例结束无条件删除
- 已登录，且在 host 集群的 default 项目空间
steps:
- 打开角色列表并定位该角色
- 行操作「编辑信息」，填写别名并确认
- 用 API 读取注解
- 行操作「删除」并确认，读取状态码
expected:
- 别名写入 kubesphere.io/alias-name 注解
- 删除后 GET 返回 404
troubleshoot:
- 别名未变时确认写的是 metadata.annotations
- 删除按钮不出现说明被当成模板角色
update_automation:
- 行操作变化时改 pages/project_settings.py
