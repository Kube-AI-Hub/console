product: 集群资源监控与企业空间成员详情两处聚合表的刷新覆盖全部来源。
preconditions:
- 已登录且有集群/企业空间权限
steps:
- 打开集群资源监控页，确认刷新入口可用并点击，观察指标请求
- 打开企业空间成员详情页，确认资源表的刷新入口存在
steps_expected:
- 三处刷新入口存在且空闲时可用
- 点击资源监控刷新会重发指标请求
expected:
- 聚合表的刷新覆盖它显示的所有来源
troubleshoot:
- 刷新后半新半旧：只重取了其中一个来源
- 面板型列表两个刷新按钮：重复接入
update_automation:
- 选择器：cluster-resource-monitor:refresh / workspace-member-<tab>:refresh
