preconditions:
- 已登录，且在 host 集群的 default 项目空间
- 该项目内至少有一个角色（含 role-template-* 模板角色）

steps:
- 打开项目角色页
- 核对表头
- 找到一个 role-template-* 角色并核对其徽标

expected:
- 表头依次为 名称、规则数、创建时间
- 模板角色行显示「模板」徽标
- 规则数为数字

troubleshoot:
- 缺列时看 SettingsListPage 的 columns
- 徽标缺失时看 isTemplateRole 的判定

