id: TC-L3-KUBE-FRONTEND-PROJECT_SETTINGS-SETTINGS_LISTS_REFRESH-01
level: 3
suite: point
module: kube-frontend
submodule: project-settings
feature: settings-lists-refresh
title: 项目设置列表刷新
entry_url: '{BASE_URL}/kube-frontend/system-workspace/clusters/host/projects/default/members'
prd: prd/kube-frontend/project-settings/settings-lists-refresh.md
design: design/kube-frontend/project-settings/settings-lists-refresh.md

covers:
- AC-L3-KUBE-FRONTEND-PROJECT_SETTINGS-SETTINGS_LISTS_REFRESH-01

story:
- US1

product: 项目成员、项目角色、网络策略三个列表提供刷新入口。
preconditions:
- 已登录且为项目管理员
steps:
- 打开项目成员列表，确认刷新入口可用
- 点击刷新，观察是否重新发起请求
- 打开项目角色与网络策略页面，确认各自的刷新入口
steps_expected:
- 三个页面的刷新入口存在且空闲时可用
- 点击后重新发起对应查询
expected:
- 网络策略页刷新不改变隔离开关
troubleshoot:
- 按钮永久禁用：schema 依赖数组缺少 isFetching
- 成员与角色句柄相同：kind 未参与句柄
update_automation:
- 选择器：members:refresh / roles:refresh / networkpolicies:refresh
