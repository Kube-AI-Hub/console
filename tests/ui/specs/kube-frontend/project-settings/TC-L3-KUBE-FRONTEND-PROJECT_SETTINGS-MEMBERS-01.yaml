preconditions:
- 已登录，且在 host 集群的 spaces 项目空间（该项目有一个成员）
- 先用 API 确认该项目确实有成员

steps:
- 打开项目成员页
- 核对表头
- 核对第一行的角色与 API 的 iam.kubesphere.io/role 注解一致

expected:
- 表头依次为 名称、状态、角色、最近活动
- 角色列等于注解值
- 状态为 活跃 或 未激活

troubleshoot:
- 没有成员时用例按 skip 处理而不是失败
- 角色为空说明读错了注解位置

update_automation:
- 成员列变化时改 pages/project_settings.py
