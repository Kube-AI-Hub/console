preconditions:
- 已登录，且在 host 集群的 default 项目空间
- 该项目内至少有一个带规则的角色

steps:
- 打开项目角色页
- 对第一行点「详情」
- 读取弹窗内规则表
- 用 API 核对该角色的 rules 数量

expected:
- 弹窗出现并含规则表
- 规则表行数等于 API 返回的 rules 数量
- 表头为 API 组、资源、动作

troubleshoot:
- 弹窗为空说明详情请求失败或 rules 为空
- 行数不符时看 toRoleRule 的数组拼接

update_automation:
- 规则结构变化时改 api-client 的 iam.ts
