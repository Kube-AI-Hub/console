id: TC-L3-KUBE-FRONTEND-SECRETS-LIST-03
level: 3
suite: point
module: kube-frontend
submodule: secrets
feature: list
title: 保密字典列表的刷新与空态出口
entry_url: '{BASE_URL}/kube-frontend/system-workspace/clusters/host/projects/default/secrets'
prd: prd/kube-frontend/secrets/list.md
design: design/kube-frontend/secrets/list.md

covers:
- AC-L3-KUBE-FRONTEND-SECRETS-LIST-03

story:
- US1

product: 列表提供刷新按钮与空态出口（清空搜索与筛选 / 刷新），供读者主动重读。
preconditions:
- 已登录且项目内可创建保密字典
steps:
- 打开项目保密字典列表，确认「刷新」按钮存在
- 在页面之外（API）新建一条 Secret，点击刷新
- 搜索一个不存在的名称进入空态，点击「刷新」
steps_expected:
- 刷新后新行出现在列表中
- 空态的刷新出口可用，点击后重新发起请求
expected:
- 集群级同名页面同样有刷新
troubleshoot:
- 刷新后仍看不到：查询键未包含搜索参数，或 refetch 未被调用
- 空态没有出口：schema.labels 未注入 emptyClear/emptyRefresh
update_automation:
- 选择器：secrets:refresh / secrets:search
