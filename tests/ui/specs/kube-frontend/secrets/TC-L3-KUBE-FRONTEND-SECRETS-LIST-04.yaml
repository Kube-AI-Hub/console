id: TC-L3-KUBE-FRONTEND-SECRETS-LIST-04
level: 3
suite: point
module: kube-frontend
submodule: secrets
feature: list
title: 保密字典列表 · 设为默认镜像仓库（列表入口，先说明会取消谁）
entry_url: '{BASE_URL}/kube-frontend/{WORKSPACE}/clusters/{CLUSTER}/projects/default/secrets'
prd: prd/kube-frontend/secrets/list.md
design: design/kube-frontend/secrets/list.md

covers:
- AC-L3-KUBE-FRONTEND-SECRETS-LIST-04

story:
- US1

product: 列表行可把镜像仓库 Secret 设为默认：确认框写明会取消谁；确认后当前对象标记为默认、旧默认被取消；非镜像仓库与已是默认的行不出现该操作。
preconditions:
- 已登录，host 集群 default 项目
- 用例创建两条 dockerconfigjson Secret（唯一命名），结束后删除
steps:
- 用 API 创建 A、B 两条镜像仓库 Secret
- 打开保密字典列表，搜索到 A，打开行操作，核对出现「设为默认镜像仓库」
- 点它，确认框正文含「A」与「将设为默认」；确认
- 轮询 API：A 的 secret.kubesphere.io/is-default-class 注解为 true
- 对 B 执行同样操作并确认
- 轮询 API：B 为 true 且 A 变为 false（旧默认被取消）
expected:
- 列表入口存在且仅对镜像仓库类型、非默认行出现
- 确认框说明会取消旧默认；确认前旧默认已查明
- 写入后只有一条 Secret 带默认标记
troubleshoot:
- 两个都为 true：没有先清旧默认（useDefaultRegistrySecret 未参与）
- 确认按钮一直禁用：旧默认查询没返回（按行命名空间查，不是页面命名空间）
update_automation:
- 行 data-ai-row=<namespace>/<name>；菜单项「设为默认镜像仓库」；确认按钮句柄 secrets:set-default-confirm
