title: "保密字典 · 设为默认镜像仓库"
entry_url: "{BASE_URL}/kube-frontend/system-workspace/clusters/host/projects/default/secrets"
prd: prd/kube-frontend/secrets/detail.md
design: design/kube-frontend/secrets/detail.md

covers:
- AC-L3-KUBE-FRONTEND-SECRETS-DETAIL-02

story:
- US2

product: 镜像仓库类型且非默认时提供「设为默认」，确认后旧默认被清除。
preconditions:
- 由用例的 fixture 创建一个前缀为 tc-e2e- 的测试对象，用例结束后无条件删除
- 已登录，且在 host 集群的 default 项目空间
- 存在一条 dockerconfigjson 类型且非默认的对象
steps:
- 打开该对象详情
- 点击「设为默认镜像仓库」并确认
- 用 kubectl 读取两条对象的注解
expected:
- 当前对象出现「默认仓库」徽标
- 「设为默认镜像仓库」按钮消失
- 当前对象注解 is-default-class 为 true，旧默认项为 false
troubleshoot:
- 旧默认未清除时检查 useRegistrySecrets 是否返回了数据
update_automation:
- 文案变化时改 packages/locales/src/index.ts
