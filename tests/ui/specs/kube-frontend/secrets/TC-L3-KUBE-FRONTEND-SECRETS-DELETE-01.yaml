product: 单条与批量删除都要求输入精确的名称串。
preconditions:
- 由用例的 fixture 创建一个前缀为 tc-e2e- 的测试对象，用例结束后无条件删除
- 已登录，且在 host 集群的 default 项目空间
- 存在两条测试对象
steps:
- 行操作「删除」
- 未输入时观察确认按钮
- 输入正确名称并确认
- 勾选另一条后点「批量删除」并输入错误串
expected:
- 确认按钮禁用
- 删除后该行消失，kubectl 返回 NotFound
- 批量时输入不完整不能确认
troubleshoot:
- 删除后列表未刷新时检查 invalidateQueries
