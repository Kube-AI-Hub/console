story:
- US2

product: basic-auth 必须填用户名与密码，含中文的值按 UTF-8 保存。
preconditions:
- 由用例的 fixture 创建一个前缀为 tc-e2e- 的测试对象，用例结束后无条件删除
- 已登录，且在 host 集群的 default 项目空间
steps:
- 创建 → 名称 → 下一步 → 类型选「用户名和密码」
- 只填用户名后提交
- 补齐密码（含中文与特殊字符）后提交
- 用 kubectl 读取对象
expected:
- 提交被拒绝并提示必填
- 提交成功后弹窗关闭、列表出现该对象
- data.username 与 data.password 解码后与输入逐字相同
troubleshoot:
- 值不一致时检查 safeBtoa 是否对非 ASCII 做了 UTF-8 编码
