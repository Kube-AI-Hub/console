product: 名称格式、重名与项目必填在进入下一步前校验。
preconditions:
- 由用例的 fixture 创建一个前缀为 tc-e2e- 的测试对象，用例结束后无条件删除
- 已登录，且在 host 集群的 default 项目空间
steps:
- 点击「创建」
- 输入含大写的名称并点「下一步」
- 输入已存在的名称并点「下一步」
expected:
- 提示「名称无效」且停留在基本信息步
- 提示「名称已存在，请输入其他名称。」
troubleshoot:
- 重名判断失败时确认 checkName 走的是 /api/v1 而不是列表接口
