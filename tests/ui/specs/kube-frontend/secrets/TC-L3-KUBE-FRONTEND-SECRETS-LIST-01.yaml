product: 列表显示名称、项目、类型、字段数、创建时间，类型显示为中文名。
preconditions:
- 由用例的 fixture 创建一个前缀为 tc-e2e- 的测试对象，用例结束后无条件删除
- 已登录，且在 host 集群的 default 项目空间
- 至少存在一条 TLS 类型的对象
steps:
- 打开列表
- 核对表头
- 读取 TLS 类型对象的类型列与字段数列
expected:
- 表头依次为 名称、项目、类型、字段数、创建时间
- TLS 对象的类型列显示「TLS 信息」
- 字段数等于 data 的键数
troubleshoot:
- 类型显示异常时先看 secretTypeLabel 映射与对象本身的 type 字段
