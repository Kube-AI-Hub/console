submodule: platform-settings
feature: third-login
title: 第三方登录状态页（身份源可读 / 不可读两态）
entry_url: '{BASE_URL}/kube-frontend/settings/third-login'
prd: prd/kube-frontend/platform-settings/third-login.md
design: design/kube-frontend/platform-settings/third-login.md

covers:
- AC-L3-KUBE-FRONTEND-PLATFORM_SETTINGS-THIRD_LOGIN-01

story:
- US1

product: 平台设置「第三方登录」状态页：接口可用时按身份源显示卡片（名称/类型）；接口未提供时明确说明「本部署未提供身份源读取接口」，不显示空列表；页面只读，不提供凭据编辑。
preconditions:
- 已登录 admin；B200 的 identityproviders 路由 404（页面应走不可读态）
steps:
- 从平台设置进入「第三方登录」（或直接访问 URL）
- 通过 API 探测 /kapis/iam…/identityproviders；按探测结果分支断言页面
- 接口 404/不可读：断言显示 unavailable 说明与原因，且没有 providers 列表
- 接口可用：断言行集合与接口一致（空则 empty 说明）
expected:
- 页面状态由接口可用性决定，不用空列表表达“没有接口”
- 403 仍走错误面板（单测覆盖）
- 页面无写入按钮/表单（老页面的 Configure 弹窗只关闭，不提交）
troubleshoot:
- 页面显示空列表：检查是否把 404 当成了 200 空集合
- 无法进入页面：确认 platform-settings 区域注册了 third-login
update_automation:
- 句柄：third-login:surface/unavailable/empty/providers/provider:<name>/retry/hint
