preconditions:
- 已登录，且有平台权限
- 平台配置 kubesphere-config 可读

steps:
- 打开平台信息页
- 核对属性名
- 读取三个值

expected:
- 属性名依次为 平台名称、平台描述、控制台地址
- 值为 - 或非空字符串

troubleshoot:
- 三行都为空说明没有 console 段（属正常），看页面是否显示 - 而不是空白

update_automation:
- 属性变化时改 pages/platform_settings.py
