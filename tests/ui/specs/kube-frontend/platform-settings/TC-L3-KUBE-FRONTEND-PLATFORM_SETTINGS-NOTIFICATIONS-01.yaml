preconditions:
- 已登录，且有平台权限
- 可读取 kubesphere-monitoring-system 中的 Secret 列表

steps:
- 读取平台的 Secret 名称列表
- 打开通知渠道页
- 逐行核对渠道名与徽标

expected:
- 五行依次为 邮件、钉钉、企业微信、Slack、Webhook
- 每行的已配置/未配置与对应 Secret 是否存在一致

troubleshoot:
- 徽标与 Secret 不符时看 toNotificationChannels 的命名规则

update_automation:
- 渠道增减时改 api-client 的 NOTIFICATION_CHANNELS
