id: TC-L3-KUBE-FRONTEND-ACCESS_CONTROL-WORKSPACE_DETAIL-02
level: 3
suite: point
module: kube-frontend
submodule: access-control
feature: workspace-detail
title: 企业空间详情 · 成员与角色
entry_url: '{BASE_URL}/kube-frontend/access/workspaces'
prd: prd/kube-frontend/access-control/workspace-detail.md
design: design/kube-frontend/access-control/workspace-detail.md

covers:
- AC-L3-KUBE-FRONTEND-ACCESS_CONTROL-WORKSPACE_DETAIL-02

story:
- US2

product: 企业空间详情展示成员：用户名、企业空间角色、状态；条数等于 workspacemembers 接口返回数。
preconditions:
- 已登录平台管理
- 平台上至少有一个企业空间且其有成员
steps:
- 用 API 读取企业空间列表与第一个企业空间的 workspacemembers
- 打开该企业空间详情
- 核对成员区块条数与角色列
expected:
- 成员条数等于 workspacemembers 返回条数
- 角色列等于 iam.kubesphere.io/workspacerole 注解
troubleshoot:
- 成员区块显示不可用：读了 tenant 的 /workspaces/<ws>/members（404），应读 iam 的 /workspaces/<ws>/workspacemembers
- 角色为空：注解键写成 workspacerole 之外的名字
update_automation:
- 选择器见 pages/access_control.py 与 WorkspaceDetailPage.tsx
