title: 用户 · 列表四列与最近登录
entry_url: '{BASE_URL}/kube-frontend/access/users'
prd: prd/kube-frontend/access-control/users.md
design: design/kube-frontend/access-control/users.md

covers:
- AC-L3-KUBE-FRONTEND-ACCESS_CONTROL-USERS-01

story:
- US1

product: 用户列表四列为用户名、状态、平台角色、最近登录；首屏按 createTime 降序；最近登录等于该行 status.lastLoginTime，从未登录显示「尚未登录」。
preconditions:
- 已登录，且有平台权限
- 该页至少有一条数据（用例先用 API 确认）

steps:
- 打开用户页
- 核对表头顺序
- 用 API 拉 `/users?limit=10&sortBy=createTime&ascending=false`，核对该页行名顺序
- 搜索 admin（若存在）或第一行用户名
- 用 API 读取该用户，核对该行最近登录

expected:
- 表头依次为 ["用户名", "状态", "平台角色", "最近登录"]
- 列表有行
- 行顺序与 `/users?limit=10&sortBy=createTime&ascending=false` 的 items 名称一致
- 最近登录等于 status.lastLoginTime 的本地时间；两者都空则显示尚未登录

troubleshoot:
- 缺列时看 PlatformListPage 的 columns
- 显示改密时间：toUserSummary 仍在读 last-login-time 注解
- 空列表时用例 skip 而不是失败

update_automation:
- 列变化时改 pages/access_control.py
