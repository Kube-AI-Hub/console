title: 企业空间控制台 · 用户组列表
entry_url: '{BASE_URL}/kube-frontend/workspaces/system-workspace/user-groups'
prd: prd/kube-frontend/access-control/workspace-user-groups.md
design: design/kube-frontend/access-control/workspace-user-groups.md

covers:
- AC-L3-KUBE-FRONTEND-ACCESS_CONTROL-WORKSPACE_CONSOLE-04

story:
- US1

product: 企业空间独立作用域：用户组页列出该空间的 IAM Group，成员数由 GroupBinding 合并计算。
preconditions:
- 已登录，且能看到至少一个企业空间
- 该企业空间的 groups 与 groupbindings 集合可读（可能均为 0 条）
steps:
- 用 API 读企业空间列表，选一个有数据的空间
- 读 /kapis/iam.kubesphere.io/v1alpha2/workspaces/<ws>/groups?limit=-1 得到组 G 与期望行数
- 读 /workspaces/<ws>/groupbindings?limit=-1，按 groupRef.name 归并 users 计算每组期望成员数
- 打开该空间的 /user-groups 页
- 等待 surface 离开 loading
- 核对表头三列与行数；若 G > 0，核对首行的成员数单元格等于期望值
expected:
- surface 可见且 data-ai-state 从 loading 变为 ready 或 empty
- 表头含 名称 / 成员 / 描述
- 行数等于 G（超过 20 行时为第一页 20 行）
- G 为 0 时表格为空态，页面不报错
troubleshoot:
- 页面错误：groups 与 groupbindings 两个请求任一失败都会报错，先单独探测两个路径
- 行数含其他空间组：用了全局 /groups 且没按企业空间过滤
- 成员数恒 0：只读了 Group 对象，没有合并 groupbindings
update_automation:
- 选择器：pages/access_control.py（origin 拼接）、WorkspaceUserGroupsPage.tsx 的 workspace-user-groups:surface
