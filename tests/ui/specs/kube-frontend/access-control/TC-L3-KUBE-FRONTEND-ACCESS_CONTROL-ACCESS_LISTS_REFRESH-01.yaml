id: TC-L3-KUBE-FRONTEND-ACCESS_CONTROL-ACCESS_LISTS_REFRESH-01
level: 3
suite: point
module: kube-frontend
submodule: access-control
feature: access-lists-refresh
title: 访问控制列表刷新
entry_url: '{BASE_URL}/kube-frontend/access/users'
prd: prd/kube-frontend/access-control/access-lists-refresh.md
design: design/kube-frontend/access-control/access-lists-refresh.md

covers:
- AC-L3-KUBE-FRONTEND-ACCESS_CONTROL-ACCESS_LISTS_REFRESH-01

story:
- US1

product: 平台用户、集群成员、集群、联邦项目四个列表提供刷新入口。
preconditions:
- 已登录且为平台管理员
steps:
- 打开平台用户列表，确认刷新入口可用并点击，观察请求
- 打开集群成员、集群、联邦项目列表，确认各自刷新入口
steps_expected:
- 四个刷新入口存在且空闲时可用
- 点击用户列表刷新会重新发起请求
expected:
- 刷新期间按钮忙碌；返回后恢复
troubleshoot:
- 按钮不存在：路由写错（平台作用域是 /access/*，联邦是 /federatedprojects）
- 集群列表两个刷新按钮：重复接入
update_automation:
- 选择器：users:refresh / cluster-members:refresh / clusters:refresh / federated-projects:refresh
