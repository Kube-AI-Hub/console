design: design/kube-frontend/access-control/workspace-members.md

covers:
- AC-L3-KUBE-FRONTEND-ACCESS_CONTROL-WORKSPACE_MEMBERS-02

story:
- US2

product: 成员列表按名称过滤、展示邮箱与「尚未登录 / 活跃」，当前用户不可勾选或改绑，批量移除用人数确认。
preconditions:
- 已登录且有成员读写权限
- 空间至少有一个可分配角色
- 仅操作唯一命名的一次性测试用户
steps:
- 创建两个一次性平台账号并写入空间成员
- 打开成员页，用前缀搜索，两行均含邮箱
- 清空搜索后核 admin 行没有复选框
- 再搜前缀，勾选两行，点批量移除并输入人数 2
- 回读空间成员集合与平台账号
expected:
- 搜索后只剩测试前缀的两行
- admin 不可勾选
- 批量确认后两名测试成员解绑，平台账号仍在
- finally 删除测试账号
troubleshoot:
- admin 仍能勾选：isRowSelectable 未排除当前用户
- 批量按钮要输入拼接用户名：DeleteDialog 批量确认词应是人数
update_automation:
- 选择器见 WorkspaceMembersPage.tsx 的 workspace-members:search / bulk-remove
