id: TC-L3-KUBE-FRONTEND-ACCESS_CONTROL-WORKSPACE_MEMBERS-03
level: 3
suite: point
module: kube-frontend
submodule: access-control
feature: workspace-members
title: 租户(企业空间)成员 · 详情属性与项目/DevOps 页签
entry_url: '{BASE_URL}/kube-frontend/workspaces/{workspace}/members/{name}'
prd: prd/kube-frontend/access-control/workspace-members.md
design: design/kube-frontend/access-control/workspace-members.md

covers:
- AC-L3-KUBE-FRONTEND-ACCESS_CONTROL-WORKSPACE_MEMBERS-03

story:
- US3

product: 成员详情展示租户(企业空间)、角色、邮箱；项目页签可读；DevOps 未部署时为空态而不是整页错误。
preconditions:
- 已登录且有成员读写权限
- 空间至少有一个可分配角色
- 仅操作唯一命名的一次性测试用户
steps:
- 创建一次性平台账号并写入空间成员
- 打开 /workspaces/<ws>/members/<name>
- 核对基本信息含租户(企业空间)、租户(企业空间)角色、邮箱
- 项目页签可见（表格或空态）
- 切到 DevOps 工程页签，页面不是 error
expected:
- 详情 surface 为 ready
- 角色与邀请时写入的 workspacerole 一致
- DevOps 页签不把整页打成 error
- finally 解绑并删除测试账号
troubleshoot:
- 整页 error 且 URL 含 devops：404 被当成致命错误，应在 api-client 里当空集合
- 角色为 -：GET 成员对象没带 iam.kubesphere.io/workspacerole
update_automation:
- 选择器见 WorkspaceMemberDetailPage.tsx 的 workspace-member-detail:*
