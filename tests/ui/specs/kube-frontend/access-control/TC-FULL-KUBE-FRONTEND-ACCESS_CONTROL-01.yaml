preconditions:
- 已登录，且有平台权限

steps:
- 打开用户页
- 确认没有项目工作区栏
- 依次切到平台角色、企业空间、用户
- 统计切换期间的文档请求

expected:
- 每页显示对应列表或空态
- 页面不出现 workspace-bar
- 切换后页签高亮跟随
- 切换期间文档请求为 0

troubleshoot:
- 出现工作区栏说明平台页复用了项目布局
- 出现文档请求说明页签退化成整页跳转

