title: 企业空间概览 · 集群信息页签（卡片、就绪链接、空态）
entry_url: '{BASE_URL}/kube-frontend/workspaces/{KA_WORKSPACE}/overview'
prd: prd/kube-frontend/access-control/workspace-console.md
design: design/kube-frontend/access-control/workspace-console.md

covers:
- AC-L3-KUBE-FRONTEND-ACCESS_CONTROL-WORKSPACE_CONSOLE-08

story:
- US2

product: 企业空间概览有两个页签：资源用量与排行（默认，保持既有区块）与集群信息；集群信息按聚合接口为每个可见集群渲染一张卡，显示别名/名称、就绪、供应商、Kubernetes 版本、节点数、可见性，就绪卡链接到集群概览，未就绪卡说明不可进入。
preconditions:
- 已登录，且在 host 集群；企业空间 system-workspace 存在
- 探测结论（2026-11-17，mlu370）：GET /kapis/tenant.kubesphere.io/v1alpha2/workspaces/system-workspace/clusters?limit=-1 返回 200 与完整 Cluster 对象（host、4paradigm）；workspace 对象没有 spec.placement.clusters
steps:
- 打开企业空间 system-workspace 概览页，确认默认「资源用量与排行」页签显示原有的资源用量区块
- 切到「集群信息」页签，等待区块离开 loading
- 从 API 读取 workspaces/system-workspace/clusters，核对卡片数与接口条数一致
- 逐卡核对别名/名称、就绪徽标、供应商、Kubernetes 版本、节点数与可见性；缺失字段应为「-」
- 逐卡核对 CPU/内存/容器组/磁盘四项使用率：从 /kapis/monitoring.kubesphere.io/v1alpha3/cluster 取同一集群的 used/total，按取整百分比核对；缺失分母或指标应显示「-」而不是 0%
- 对 Ready 条件为 True 的卡，核对存在进入链接且 href 指向 /kube-frontend/clusters/<name>/overview；未就绪卡无链接且有不可进入说明
- 切回「资源用量与排行」页签，确认资源区块与排行仍在
expected:
- 卡片数 = 聚合接口条数；缺失字段显示「-」而不是 0
- 四项使用率与监控接口的同次 used/total 取整一致；分母缺失显示「-」，监控失败只影响该卡比率
- Ready 条件为 True → 已就绪 + 进入链接；否则未就绪 + 不可进入说明
- 聚合为空时显示「该企业空间尚未授权任何集群」空态；聚合失败时显示错误与重试（本用例在实时环境任一分支成立即断言对应分支）
- 默认资源页签保持既有区块，切页签不重复请求已缓存的查询
troubleshoot:
- 页签不可见：确认概览 state=ready；集群信息页签在两个页签组件内
- 卡片数为 0 但接口非空：确认 WorkspaceOverviewPage 使用 workspaceDetailApi.clusters（tenant 聚合）而不是 workspace.spec.placement
- 就绪判断相反：只认 conditions 中 type=Ready 且 status=True；缺条件不算就绪
- 进入链接 404：href 必须是 /kube-frontend/clusters/<name>/overview（应用前缀 + 集群作用域）
update_automation:
- 卡片/字段 data-ai-id 变化时同步本用例与 pages/ 选择器
