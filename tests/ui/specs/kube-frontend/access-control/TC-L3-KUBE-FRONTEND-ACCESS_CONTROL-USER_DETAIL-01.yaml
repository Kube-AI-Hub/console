id: TC-L3-KUBE-FRONTEND-ACCESS_CONTROL-USER_DETAIL-01
level: 3
suite: point
module: kube-frontend
submodule: access-control
feature: user-detail
title: 用户详情 · 基本信息与登录历史
entry_url: '{BASE_URL}/kube-frontend/access/users'
prd: prd/kube-frontend/access-control/user-detail.md
design: design/kube-frontend/access-control/user-detail.md

covers:
- AC-L3-KUBE-FRONTEND-ACCESS_CONTROL-USER_DETAIL-01

story:
- US1

product: 从用户列表点用户名进入详情：用户名、邮箱、平台角色、状态、创建时间、最近登录、描述，以及最近 10 次登录记录（时间 + 方式）。
preconditions:
- 已登录平台管理
- 平台上至少有一个用户（优先使用 ui-test）
steps:
- 用 API 读取用户与登录记录
- 打开用户列表，点击该用户名
- 核对 URL 与基本信息
- 核对「最近登录」与 status.lastLoginTime 一致
- 核对登录历史条数等于接口返回条数
expected:
- 详情页可达且 ready
- 状态与 status.state 一致（缺失按 Active）
- 最近登录等于 status.lastLoginTime（回退注解）
- 登录记录条数与 /loginrecords 返回一致
troubleshoot:
- 最近登录显示改密时间：读的是注解而非 status.lastLoginTime
- 登录历史为空但接口有条目：读取的不是 loginrecords 集合
- 整页报错而登录记录不可用：两个查询未独立降级
update_automation:
- 选择器见 pages/access_control.py 与 UserDetailPage.tsx
