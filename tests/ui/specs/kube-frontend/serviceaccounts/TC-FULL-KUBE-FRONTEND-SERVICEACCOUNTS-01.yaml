id: TC-FULL-KUBE-FRONTEND-SERVICEACCOUNTS-01
level: 2
suite: full
module: kube-frontend
submodule: serviceaccounts
feature: page
title: 服务账户 · 详情属性与 kubeconfig
entry_url: "{BASE_URL}/kube-frontend/system-workspace/clusters/host/projects/default/serviceaccounts"
prd: prd/kube-frontend/serviceaccounts/_index.md
design: design/kube-frontend/serviceaccounts/_index.md

covers:
- AC-FULL-KUBE-FRONTEND-SERVICEACCOUNTS-01

story:
- US1
- US2
- US3

product: 有令牌的账户在详情页给出属性与可下载的 kubeconfig。
preconditions:
- 已登录，且在 host 集群的 default 项目空间
- 用例会创建一个手工令牌 Secret 并把它挂到测试账户的 secrets[] 上，结束后两者都删除
steps:
- 打开测试账户详情
- 读取属性区
- 读取 kubeconfig 文本
- 点击下载
expected:
- 属性区显示集群、项目、角色、创建时间、创建者
- kubeconfig 含 server: https://kubernetes.default.svc:443
- current-context 为 <sa>@local
- 下载得到 kubeconfig.yaml
troubleshoot:
- 没有令牌时先确认集群是否启用了 LegacyServiceAccountTokenNoAutoGeneration
update_automation:
- 文案变化时改 packages/locales/src/index.ts
