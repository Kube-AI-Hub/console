story:
- US1

product: 选中两个配置字典后批量删除，确认框要求输入数量，确认后两者都被删除。
preconditions:
- 由夹具创建两个 tc-e2e- 配置字典，用例结束无条件删除
- 已登录，且在 host 集群的 default 项目空间
steps:
- 打开配置字典列表并选中这两行
- 点批量删除
- 在确认框输入数量 2 并确认
- 用 API 查询两者
expected:
- 确认框可以完成（按钮可用）
- 两个对象都不存在
troubleshoot:
- 按钮始终禁用说明确认文本仍是名字拼接而非数量
- 只删了一个说明批量执行被中断
update_automation:
- 确认方式变化时改 components/resource/DeleteDialog
