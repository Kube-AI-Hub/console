product: 切换到 YAML 模式粘贴合法对象后可直接提交，非法 YAML 时禁止提交。
preconditions:
- 已登录
- 项目 default 中至少存在一个配置字典
steps:
- 点击「创建」
- 点击「编辑 YAML」
- 粘贴一段非法 YAML
- 改为合法 YAML 后提交
expected:
- 非法 YAML 时提示「YAML 格式有误，请修正后再提交。」且提交按钮禁用
- 合法后提交成功，对象按 YAML 内容创建
troubleshoot:
- 先确认 BFF 返回的状态码与 code，再看页面状态属性
