id: TC-L3-KUBE-FRONTEND-CONFIGMAPS-LIST-12
level: 3
suite: point
module: kube-frontend
submodule: configmaps
feature: list
title: 每页档位收口 · 一次读全的列表在客户端切片
entry_url: '{BASE_URL}/kube-frontend/clusters/{CLUSTER}/components'
prd: prd/kube-frontend/configmaps/list.md
design: design/kube-frontend/configmaps/list.md

covers:
- AC-L3-KUBE-FRONTEND-CONFIGMAPS-LIST-12

story:
- US1

product: 灰度发布、集群成员、系统组件、自定义资源及其实例、多集群、持久卷这 7 个列表都有每页条数选择器（10/20/50/100）；一次读全后在客户端切片，分页器显示的总数仍是全部行数。
preconditions:
- 已登录，host 集群；系统组件接口可读且条数多于一页（本环境约 47 条）
steps:
- 用 API 读系统组件，记录总数 N
- 打开 /kube-frontend/clusters/host/components，等列表就绪
- 核对首屏行数 = min(N, 20)，分页器文案含「共 N 条」
- 点「下一页」，核对首屏第一行换成第 21 行对应的组件，行数 = N - 20（不足一页时）
- 点每页条数选择器选 50，核对行数 = min(N, 50) 且回到第 1 页
expected:
- 选择器句柄 components:page-size 存在，选项 10/20/50/100
- 首屏只渲染当前页的行；总数来自全部行（不是当前页条数）
- 翻页不重新请求（同一份数据换窗口）；切换档位回到第 1 页
troubleshoot:
- 分页器显示的总数等于当前页条数：total 取了切片后的长度
- 选了档位行数不变：pagination.pageSize 仍写常量，或列表没接 onPageSizeChange
- 翻页后空白：页码没有夹住（数据变少时停在空页）
update_automation:
- 句柄：components:page-size；行 data-ai-row；分页器文案在 ResourceList 内
