id: TC-L3-KUBE-FRONTEND-CONFIGMAPS-LIST-06
level: 3
suite: point
module: kube-frontend
submodule: configmaps
feature: list
title: "配置字典 · 名称列与创建时间格式"
entry_url: "{BASE_URL}/kube-frontend/system-workspace/clusters/host/projects/kube-frontend-demo/configmaps"
prd: prd/kube-frontend/configmaps/list.md
design: design/kube-frontend/configmaps/list.md

covers:
- AC-L3-KUBE-FRONTEND-CONFIGMAPS-LIST-06

story:
- US1

product: 名称列第一行显示别名（无别名时显示名称），第二行显示描述；创建时间固定为 `YYYY-MM-DD HH:mm:ss`。
preconditions:
- 已登录，且项目内同时存在「有别名」与「无别名」的 ConfigMap
steps:
- 打开 {BASE_URL}/kube-frontend/system-workspace/clusters/host/projects/kube-frontend-demo/configmaps
- 读取有别名那条的名称单元格
- 读取无别名那条的名称单元格
- 读取任意一行的创建时间单元格
expected:
- 有别名的那行第一行为别名文本，不出现「名称 (别名)」这种拼接
- 无别名的那行第一行为对象名称
- 第二行为描述，无描述时为 `-`
- 创建时间匹配 `^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$`
troubleshoot:
- 时间显示成 `2026/11/10 04:16` 说明又用了 Intl 的 dateStyle
- 名称出现括号拼接说明把 alias 追加进了名称
update_automation:
- 别名与描述的注解键为 kubesphere.io/alias-name / kubesphere.io/description
