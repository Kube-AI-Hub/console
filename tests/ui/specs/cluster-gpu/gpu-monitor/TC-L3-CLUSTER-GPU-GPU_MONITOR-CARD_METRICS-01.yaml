id: TC-L3-CLUSTER-GPU-GPU_MONITOR-CARD_METRICS-01
level: 3
suite: point
module: cluster-gpu
submodule: gpu-monitor
feature: card-metrics
title: 卡维度指标 · 按 UUID 隔离
entry_url: "{BASE_URL}/clusters/default/nodes/{node}/gpus/{uuid}/status"
prd: prd/cluster-gpu/gpu-monitor/card-metrics.md
design: design/cluster-gpu/gpu-monitor/card-metrics.md

covers:
- AC-L3-CLUSTER-GPU-GPU_MONITOR-CARD_METRICS-01

story:
- US1
- US2

product: 单卡 Monitoring 页签只显示这一张卡的五项指标，与同节点其它卡不同。
preconditions:
- 已登录，且在 default 集群
- 节点上有至少两张卡，其中一张在跑负载
steps:
- 从节点运行状态页点一张有负载的卡的 UUID
- 切到 Monitoring 页签，记录五条曲线的峰值
- 返回，点另一张空闲卡的 UUID，切到 Monitoring
expected:
- 两次的曲线数值明显不同
- 有负载卡的利用率明显高于空闲卡
- 每页都有使用率、显存用量、分配率、功耗、温度五项
- 不出现未翻译的 key
troubleshoot:
- 两页数值相同说明 gpu_uuid 没传到查询
- 缺某项时确认 exporter 是否产出该指标族
update_automation:
- 指标名变化时改 pages 与 expected
