id: TC-FULL-CLUSTER-GPU-GPU_CARD-01
level: 2
suite: full
module: cluster-gpu
submodule: gpu-card
feature: page
title: 显卡列表 · 集群页与节点页一致
entry_url: "{BASE_URL}/clusters/default/gpus"
prd: prd/cluster-gpu/gpu-card/_index.md
design: design/cluster-gpu/gpu-card/_index.md

covers:
- AC-FULL-CLUSTER-GPU-GPU_CARD-01

story:
- US1
- US2

product: 集群页与节点页对同一张卡显示相同状态，点 UUID 可进入单卡详情且状态一致。
preconditions:
- 已登录，且在 default 集群
- 集群至少有一个 GPU 节点
steps:
- 打开 {BASE_URL}/clusters/default/gpus
- 记录某一行 UUID 与状态
- 打开该行的节点运行状态页，读取显卡列表里同一 UUID 的状态
- 点该 UUID 进入单卡详情，读取侧栏状态
expected:
- 节点页表格含序号 / UUID / 状态 / 型号 / NUMA / 厂商 / 模式 / vGPU / 核心 / 显存
- 节点页该 UUID 的状态与集群页一致
- 单卡详情侧栏状态与列表一致
troubleshoot:
- 两页状态不一致时先确认两次请求是否命中同一份缓存（间隔应小于 5 分钟）
- 单卡详情为空时确认 URL 里的 uuid 是否被 encodeURIComponent 处理
update_automation:
- 状态映射变化时改 pages/gpu_cards.py 的 status 读取
