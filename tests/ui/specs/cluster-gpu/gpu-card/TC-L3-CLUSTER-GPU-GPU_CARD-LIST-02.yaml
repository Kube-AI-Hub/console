preconditions:
- 已登录
- 成员集群 xc 的显卡页可打开
steps:
- 拦截 GET /kapis/gpu.kubesphere.io/v1alpha1/gpus 与 /gpus/stats，记录 URL
- 打开 {BASE_URL}/clusters/xc/gpus
expected:
- gpus 与 gpus/stats 的 URL query 都含 cluster=xc
- URL 不含 /kapis/clusters/xc/
update_automation:
- 接口改走 /kapis/clusters/<id>/ 路径时代理会丢掉 host handler，本用例必须失败
