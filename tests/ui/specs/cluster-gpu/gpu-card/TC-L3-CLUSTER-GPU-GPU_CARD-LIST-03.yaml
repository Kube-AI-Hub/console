product: 子集群节点运行状态页的 RDMA 端口请求带 cluster=xc，路径不含 /kapis/clusters/xc/。
preconditions:
- 已登录
- 成员集群 xc 的节点页 /clusters/xc/nodes/node201-xpu/status 可打开
steps:
- 拦截 GET /kapis/rdma.kubesphere.io/v1alpha1/ports，记录 URL，返回空列表
- 打开 {BASE_URL}/clusters/xc/nodes/node201-xpu/status
expected:
- 拦截到的 URL query 含 cluster=xc 与 nodeName=node201-xpu
- URL 不含 /kapis/clusters/xc/
update_automation:
- 漏传 cluster 时 host Prometheus 的端口会混进子集群页，本用例必须失败
