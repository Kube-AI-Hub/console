id: TC-CORE-CLUSTER-GPU-01
level: 1
suite: core
module: cluster-gpu
submodule: gpu-card
feature: page
title: 集群算力 · 入口与显卡总览
entry_url: "{BASE_URL}/clusters/default/gpus"
prd: prd/cluster-gpu/_index.md
design: design/cluster-gpu/_index.md

covers:
- AC-CORE-CLUSTER-GPU-01

story:
- US1

product: 集群算力入口可打开，显卡列表与健康比例可见，不出现未翻译 key。
preconditions:
- 已登录，且在 default 集群
- 集群至少有一个 GPU 节点
steps:
- 打开 {BASE_URL}/clusters/default/gpus
- 读取页面标题与表格表头
- 读取健康显卡比例的文本
- 检查页面是否出现未翻译的 key
expected:
- 页面标题为「显卡」
- 表格含节点 / 序号 / UUID / 状态 / 型号 / NUMA / 厂商 / 模式 / vGPU / 核心 / 显存
- 健康比例显示为百分比
- 不出现形如 XXX_PL / XXX_SCAP 的未翻译 key
troubleshoot:
- 表格为空时先确认节点上有 hami.io/node-nvidia-register 注解
- 健康比例恒为 100% 时确认 register 注解里是否有 health:false
update_automation:
- 列顺序变化时改 pages/gpu_cards.py
