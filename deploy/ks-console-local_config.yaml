server:
  http:
    hostname: localhost
    port: 8000
    static:
      production:
        /public: server/public
        /assets: dist/assets
        /dist: dist
  redis:
    port: 6379
    host: redis.kubesphere-system.svc
  redisTimeout: 5000
  sessionTimeout: 7200000
  # The new console on this host's /kube-frontend prefix. Mounting it here is what
  # makes the header entry appear and what routes the prefix to its deployment;
  # setting `enabled: false` (or emptying `target`) removes both, which is the
  # rollback path.
  newConsole:
    enabled: true
    target: http://kube-frontend.kubesphere-system.svc:8080
client:
  version:
    kubesphere: v3.3.2
    kubernetes: v1.28.15
    openpitrix: v3.3.2
  enableKubeConfig: true
defaultClusterName: default
