server:
  http:
    hostname: localhost
    port: 8000
    static:
      production:
        /public: server/public
        /assets: dist/assets
        /dist: dist
  redis:
    port: 6379
    host: redis.kubesphere-system.svc
  redisTimeout: 5000
  sessionTimeout: 7200000
  # The new console on this host's /kube-frontend prefix. Mounting it here is what
  # makes the header entry appear. This process serves its build itself (the SPA is
  # copied into this image), so there is no upstream target; setting
  # `enabled: false` removes both the entry and the prefix, which is the rollback
  # path.
  newConsole:
    enabled: true
    selfHosted: true
client:
  version:
    kubesphere: v3.3.2
    kubernetes: v1.28.15
    openpitrix: v3.3.2
  enableKubeConfig: true
defaultClusterName: default
