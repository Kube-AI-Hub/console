# Copyright 2026 Kube AI Hub.
#
# The new console (kube-frontend) on mlu370.
#
# Served under the same host and port as the old console, on the `/kube-frontend`
# prefix: `ks-console` proxies that prefix here (see `server/config.yaml` →
# `newConsole`). One container serves both the built SPA and the BFF, so there is
# no separate static server to keep in sync.
#
# Deploy:
#   kubectl apply -f console/deploy/kube-frontend.yaml
#
# Roll back by disabling the entry in `ks-console-config` (`newConsole.enabled:
# false`); this deployment can then be removed without affecting the old console.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-frontend
  namespace: kubesphere-system
  labels:
    app: kube-frontend
    tier: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: kube-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: kube-frontend
        tier: frontend
    spec:
      containers:
        - name: kube-frontend
          image: watering-ai-registry.cn-shanghai.cr.aliyuncs.com/kube-ai-hub/kube-frontend:develop-20261117c
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # ks-apiserver, in-cluster. The BFF forwards `/kapis`, `/apis` and
            # `/api/v1` here unchanged; it holds no credentials of its own.
            - name: KS_API_URL
              value: http://ks-apiserver.kubesphere-system.svc
            # This cluster registers the `kubesphere` OAuth client with the same
            # secret; a wrong pair fails as `invalid_client`, which the login form
            # reports as a server problem rather than a bad password.
            - name: KS_OAUTH_CLIENT_ID
              value: kubesphere
            - name: KS_OAUTH_CLIENT_SECRET
              value: kubesphere
            - name: KS_OAUTH_ENCRYPT_KEY
              value: kubesphere
          # Answers 200 without touching the cluster, so a probe never depends on
          # ks-apiserver being up.
          readinessProbe:
            httpGet:
              path: /api/ai/manifest
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/ai/manifest
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      # The image is amd64-only; the cluster is amd64, so no affinity is needed.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: kube-frontend
  namespace: kubesphere-system
  labels:
    app: kube-frontend
spec:
  type: ClusterIP
  selector:
    app: kube-frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
