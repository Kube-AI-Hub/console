<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><%= title %></title>
    <meta name="keywords" content="行业大模型、算力平台、Huggingface、开源社区、数据集、开源代码、算力租赁" />
    <meta name="description" content="模型平台：让大模型赋能每一个人。" />
    <link rel="shortcut icon" href="/platform-model/images/favicon.svg" />
    <script>
      const CSGHUB_SERVER = "";
      const DEFAULT_TAGS = "[]";
      const ON_PREMISE = "<%= onPremise %>";
      const ENABLE_HTTPS = "<%= enableHttps %>";
      window.CSGHUB_CONSOLE_TOKEN_KEY = "kah_token";
    </script>
    <script>
      (function () {
        var open = window.open;
        if (typeof open !== 'function') return;
        window.open = function (url, name, features) {
          try {
            var parsed = new URL(String(url), window.location.origin);
            var idx = parsed.pathname.indexOf('/-/label-studio');
            if (idx >= 0) {
              if (parsed.pathname.indexOf('/platform-model/-/label-studio') !== 0) {
                parsed.pathname = '/platform-model' + parsed.pathname.slice(idx);
              }
              url = parsed.pathname + parsed.search + parsed.hash;
            }
          } catch (e) {}
          return open.call(window, url, name, features);
        };
      })();
    </script>
    <%- assetsHtml %>
  </head>
  <body>
    <div id="app" class="flex flex-col min-h-screen">
      <div class="grow">
        <navbar v-if="!$route.meta.hideMainNavbar"></navbar>
        <router-view></router-view>
      </div>
    </div>
  </body>
</html>
