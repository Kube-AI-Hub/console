<meta charset="utf-8">
<title>{{ with .Params.Title }}{{ . }}{{ else }}{{ with .Site.Params.title }}{{ . }}{{ end }}{{ end }}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description"
  content="{{ with .Params.Description }}{{ . }}{{ else }}{{ with .Site.Params.description }}{{ . }}{{ end }}{{ end }}">
<meta name="keywords"
  content="{{ with .Params.Keywords }}{{ range $i, $e := . }}{{ if $i }} {{ end }}{{ $e }}{{ end }}{{ else }}{{ with .Site.Params.keywords }}{{ . }}{{ end }}{{ end }}">

<meta property="og:type" content="article" />
<meta property="og:title"
  content="{{ with .Params.Title }}{{ . }}{{ else }}{{ with .Site.Params.title }}{{ . }}{{ end }}{{ end }}" />
<meta property="og:description"
  content="{{ with .Params.Description }}{{ . }}{{ else }}{{ with .Site.Params.description }}{{ . }}{{ end }}{{ end }}" />
<meta property="og:image"
  content="{{ with .Params.snapshot }}{{ . | absURL }}{{ else }}{{ with .Site.Params.snapshot }}{{ . | absURL }}{{ end }}{{ end }}" />
<meta property="og:url" content="{{ .Permalink }}" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:site" content="@KubeAIHub" />
<meta property="twitter:image"
  content="{{ with .Params.snapshot }}{{ . | absURL }}{{ else }}{{ with .Site.Params.snapshot }}{{ . | absURL }}{{ end }}{{ end }}" />


<link rel="canonical" href="{{ .Permalink }}" />

{{- partial "favicons.html" . -}}

{{- partial "css.html" . -}}

{{ $basePath := strings.TrimSuffix "/" .Site.Params.logoLink }}
<script src='{{ $basePath }}/js/jquery-3.7.1.min.js'></script>
<script src='{{ $basePath }}/js/viewer.min.js'></script>
<script src='{{ $basePath }}/js/jquery.modal.min.js'></script>
<script src='{{ $basePath }}/swiper/swiper-bundle.min.js'></script>

{{ if or (.IsDescendant (.GetPage "/docs")) (.IsDescendant (.GetPage "/platform-model")) }}
<link href='{{ $basePath }}/pagefind/pagefind-ui.css' rel="stylesheet">
<script src='{{ $basePath }}/pagefind/pagefind-ui.js'></script>
{{ end }}
